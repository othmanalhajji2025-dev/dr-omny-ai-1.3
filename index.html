  if(has(["dosage","renal","kidney","كلوي","كلى","كبد","hepatic","liver","pregnan","حمل","حامل","pediatric","child","طفل","tdm","monitor","مستوى دواء"])) refs.push("KDIGO","Sanford Guide","Medscape Dose Adjustments","Lexicomp","Micromedex");
  if(has(["anatomy","تشريح","bone","muscle","nerve","organ","عضو","عظام","عضلة","عصب","nerve","joint","مفصل","head","neck","رأس","رقبة","abdomen","بطن"])) refs.push("Gray's Anatomy","TeachMeAnatomy","Kenhub","e-Anatomy (IMAIOS)","Radiopaedia","Neuroanatomy Online");
  if(has(["x-ray","xray","scan","ct","mri","ultrasound","echo","أشعة","تصوير","سكان","رنين","موجات","ecg","ekg","تخطيط","radiolog","أشعة"])) refs.push("Radiopaedia","ACR Appropriateness Criteria","MedPix","RadioGraphics");
  if(has(["lab","تحليل","تحاليل","lab result","creatinine","كرياتينين","cbc","hba1c","سكر تراكمي","electrolyte","كهارل","range","قيمة طبيعية"])) refs.push("MedlinePlus Lab Tests","Mayo Clinic Labs","ARUP Consult","Testing.com");
  if(has(["guideline","protocol","إرشاد","بروتوكول","management","تدبير","recommend","توصية"])) refs.push("WHO Guidelines","NICE Guidance","IDSA","AHA/ACC","ESC","GOLD","GINA","ADA","ACOG","AAP","USPSTF");
  if(has(["score","calculator","مقياس","حاسبة","risk","خطر","wells","cha2ds2","child-pugh","gcs"])) refs.push("MDCalc","QxMD Calculate");
  if(has(["yemen","اليمن","يمن","صنعاء","عدن","إقليمي","malaria","ملاريا","قات","كوليرا","cholera","tb","سل"])) refs.push("WHO EMRO","WHO Yemen","CDC Travel Health","MSF Clinical Guidelines");
  return [...new Set(refs)].join(", ");
}

/* ---------- الذاكرة (تبويب) ---------- */
function dateStr(ms){ try{ return new Date(ms).toLocaleDateString(LANG,{day:"numeric",month:"short"}); }catch(e){ return ""; } }
function timeStr(ms){ try{ return new Date(ms).toLocaleTimeString(LANG,{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
function dayStr(ms){ try{ return new Date(ms).toLocaleDateString(LANG,{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }catch(e){ return dateStr(ms); } }

/* ---------- ملفات المرضى: كل ملف باسم صاحبه، وداخله كل الرسائل والردود بالتاريخ ---------- */
const PAT_GENERAL="__general__";
let patOpenId="";
function patAll(){ return load("omni_patients",[]); }
function patSaveAll(a){ save("omni_patients",a); }
function patActiveStored(){ try{ return localStorage.getItem("omni_active_patient")||""; }catch(e){ return ""; } }
function patSetActive(id){ try{ localStorage.setItem("omni_active_patient", id||""); }catch(e){} }
function curPatient(){
  const aid=patActiveStored();
  if(aid){ const p=patAll().find(x=>x.id===aid); if(p) return {id:p.id, name:p.name||t("mem_general")}; }
  const h=pfActive();
  if(h && String(h.name||"").trim()) return {id:h.id, name:String(h.name).trim()};
  return {id:PAT_GENERAL, name:t("mem_general")};
}
function patEnsure(id,name){
  if(!id) id=PAT_GENERAL;
  const a=patAll();
  let p=a.find(x=>x.id===id);
  if(!p){ p={id:id, name:name||t("mem_general"), created:Date.now(), updated:Date.now(), msgs:[]}; a.push(p); }
  else if(name && p.name!==name){ p.name=name; }
  patSaveAll(a); return p;
}
function patLog(role,text){
  text=String(text==null?"":text).replace(/\s+$/,"").trim();
  if(!text) return;
  const cur=curPatient();
  const a=patAll();
  let p=a.find(x=>x.id===cur.id);
  if(!p){ p={id:cur.id, name:cur.name, created:Date.now(), updated:Date.now(), msgs:[]}; a.push(p); }
  else if(cur.name && p.name!==cur.name) p.name=cur.name;
  p.msgs.push({r:(role==="user"?"u":"a"), t:text.slice(0,24000), d:Date.now()});
  if(p.msgs.length>600) p.msgs=p.msgs.slice(-600);
  p.updated=Date.now();
  patSaveAll(a);
}
function patCasesAll(id){
  const cs=load("omni_cases",[]);
  return cs.filter(c=> c.pid===id || (id===PAT_GENERAL && !c.pid));
}
function patDelFile(id){
  if(!confirm(t("mem_delConfirm"))) return;
  patSaveAll(patAll().filter(x=>x.id!==id));
  if(patActiveStored()===id) patSetActive("");
  if(patOpenId===id) patOpenId="";
  save("omni_cases", load("omni_cases",[]).filter(c=>c.pid!==id));
  toast(t("mem_delOk")); renderMem();
}
function patOpen(id){ patOpenId=id; renderMem(); }
function patRename(id){
  const p=patAll().find(x=>x.id===id); if(!p) return;
  const nm=document.querySelector("#patFileBody .patFileHead .nm"); if(!nm) return;
  nm.innerHTML='<input class="pfInput" id="patRenameInput" type="text" style="max-width:230px" value="'+esc(p.name||"")+'"><button class="pfBtn" id="patRenameSave">💾 '+esc(t("pf_save"))+"</button>";
  const inp=document.getElementById("patRenameInput"); inp.focus(); inp.select();
  const doSave=()=>{ const v=inp.value.trim(); if(!v){ inp.focus(); return; }
    const a=patAll(); const q=a.find(x=>x.id===id); if(q){ q.name=v; q.updated=Date.now(); patSaveAll(a); } renderMem(); };
  document.getElementById("patRenameSave").onclick=doSave;
  inp.onkeydown=(e)=>{ if(e.key==="Enter") doSave(); else if(e.key==="Escape") renderMem(); };
}
function patClose(){ patOpenId=""; renderMem(); }
function patDownload(p){
  const msgs=(p.msgs||[]);
  const cases=patCasesAll(p.id);
  downloadWordDoc({
    patientName:p.name||t("mem_general"),
    profileLines:[[t("mem_files"), p.name||t("mem_general")],[t("mem_created"), dayStr(p.created)],[t("mem_updated"), dayStr(p.updated)],[t("xl_msgs"), String(msgs.length)],[t("xl_cases"), String(cases.length)]],
    messages:msgs.map(m=>({role:m.r, text:m.t, date:m.d})),
    cases:cases,
    date:Date.now()
  });
}

/* ---------- إجراءات الرسائل المحفوظة: طي / تعديل / حذف / إعادة فتح ---------- */
function patGetMsg(pid, idx){
  const a=patAll(); const p=a.find(x=>x.id===pid);
  if(!p||!p.msgs||!p.msgs[idx]) return null;
  return {a:a, p:p, m:p.msgs[idx]};
}
function patToggleFold(pid, idx){ const r=patGetMsg(pid,idx); if(!r) return; r.m.fold=!r.m.fold; r.p.updated=Date.now(); patSaveAll(r.a); renderMem(); }
function patDelMsg(pid, idx){
  const r=patGetMsg(pid,idx); if(!r) return;
  if(!confirm(t("mem_delMsgConfirm"))) return;
  r.p.msgs.splice(idx,1); r.p.updated=Date.now(); patSaveAll(r.a); renderMem(); toast(t("mem_delMsgOk"));
}
function patEditMsg(pid, idx){
  const body=document.getElementById("patFileBody"); if(!body) return;
  const row=body.querySelector('[data-msg="'+pid+":"+idx+'"]'); if(!row) return;
  const r=patGetMsg(pid,idx); if(!r) return;
  const tx=row.querySelector(".tx"); if(!tx) return;
  row.classList.remove("folded");
  tx.innerHTML='<textarea class="pfArea" id="patEditArea" style="min-height:110px">'+esc(r.m.t)+"</textarea>"
    +'<div class="patActs"><button class="pfBtn" id="patEditSave" style="min-width:0">💾 '+esc(t("pf_save"))+"</button>"
    +'<button class="pfBtn ghost" id="patEditCancel" style="min-width:0">✕ '+esc(t("mem_close"))+"</button></div>";
  const ta=document.getElementById("patEditArea"); ta.focus();
  document.getElementById("patEditCancel").onclick=()=>renderMem();
  document.getElementById("patEditSave").onclick=()=>{
    const v=ta.value.replace(/\s+$/,"").trim(); if(!v){ ta.focus(); return; }
    const rr=patGetMsg(pid,idx); if(!rr) return;
    rr.m.t=v; rr.m.edited=Date.now(); rr.p.updated=Date.now(); patSaveAll(rr.a); renderMem(); toast(t("mem_editSaved"));
  };
}
function patReopenMsg(pid, idx){
  const r=patGetMsg(pid,idx); if(!r) return;
  patSetActive(pid); patEnsure(pid, r.p.name);
  showTab("chat");
  addBubble(r.m.r==="u"?"user":"assistant", r.m.r==="u"?esc(r.m.t):renderAI(r.m.t));
  chatInput.value=r.m.t; chatInput.focus();
  toast(t("mem_reopened"));
}
function renderMem(){
  const pearls=load("omni_pearls",[]).slice().reverse();
  const pl=document.getElementById("pearlList");
  if(pl){
    pl.innerHTML="";
    if(!pearls.length) pl.innerHTML='<p class="empty">'+t("mem_empty")+"</p>";
    pearls.forEach(p=>{
      const d=document.createElement("div"); d.className="memCard";
      d.innerHTML='<div class="mh">💡 '+esc(dateStr(p.date))+(p.auto?' <span class="auto">'+t("mem_auto")+"</span>":"")+"</div><p>"+esc(p.text)+"</p>";
      pl.appendChild(d);
    });
  }
  renderPatTabs();
}
function renderPatTabs(){
  const tabs=document.getElementById("patTabs"), body=document.getElementById("patFileBody");
  if(!tabs||!body) return;
  if(load("omni_cases",[]).some(c=>!c.pid) && !patAll().some(x=>x.id===PAT_GENERAL)) patEnsure(PAT_GENERAL, t("mem_general"));
  const list=patAll().slice().sort((a,b)=>(b.updated||0)-(a.updated||0));
  tabs.innerHTML="";
  if(!list.length){ tabs.innerHTML='<p class="empty" style="width:100%">'+esc(t("mem_noFiles"))+"</p>"; body.innerHTML=""; return; }
  if(!patOpenId || !list.find(x=>x.id===patOpenId)) patOpenId=list[0].id;
  const activeId=curPatient().id;
  list.forEach(p=>{
    const b=document.createElement("button");
    b.className="patTab"+(p.id===patOpenId?" on":"");
    b.innerHTML=esc(p.name||t("mem_general"))+(p.id===activeId?' <span title="'+esc(t("mem_active"))+'">🟢</span>':"")+' <span class="cnt">'+((p.msgs||[]).length)+"</span>";
    b.onclick=()=>patOpen(p.id);
    tabs.appendChild(b);
  });
  renderPatFile(list.find(x=>x.id===patOpenId));
}
function renderPatFile(p){
  const body=document.getElementById("patFileBody");
  if(!body) return;
  if(!p){ body.innerHTML=""; return; }
  const msgs=(p.msgs||[]);
  const cases=patCasesAll(p.id);
  const isActive=curPatient().id===p.id;
  let h='<div class="patFile">';
  h+='<div class="patFileHead"><div class="nm">🗂️ '+esc(p.name||t("mem_general"))+(isActive?' <span class="pfOpt">🟢 '+esc(t("mem_active"))+"</span>":"")+"</div>"
   +'<div class="meta">'+esc(t("mem_created"))+": "+esc(dateStr(p.created))+" · "+esc(t("mem_updated"))+": "+esc(dateStr(p.updated))+"</div></div>";
  if(!isActive) h+='<p class="pfHint">'+esc(t("mem_activeHint"))+"</p>";
  h+='<div class="patActs">'
   +(isActive?"":'<button class="pfBtn alt" data-patact="active">🟢 '+esc(t("mem_setActive"))+"</button>")
   +'<button class="pfBtn alt" data-patact="rename">✏️ '+esc(t("pf_edit"))+"</button>"
   +'<button class="pfBtn ghost" data-patact="dl">📄 '+esc(t("dlWord"))+"</button>"
   +'<button class="pfBtn ghost" data-patact="xl">📊 '+esc(t("xl_exportOne"))+"</button>"
   +'<button class="pfBtn warn" data-patact="del">🗑️ '+esc(t("mem_delFile"))+"</button>"
   +'<button class="pfBtn ghost" data-patact="close">✕ '+esc(t("mem_close"))+"</button>"
   +"</div>";
  h+='<div class="patSec"><h3>💬 '+esc(t("mem_msgs"))+' <span class="pfOpt">'+msgs.length+"</span></h3>";
  if(!msgs.length) h+='<p class="empty">'+esc(t("mem_emptyFile"))+"</p>";
  else{
    let lastDay="";
    msgs.forEach((m,mi)=>{
      const day=dayStr(m.d);
      if(day!==lastDay){ h+='<div class="patDay">'+esc(day)+"</div>"; lastDay=day; }
      const isU=m.r==="u";
      const fold=!!m.fold;
      h+='<div class="patMsg '+(isU?"user":"assistant")+(fold?" folded":"")+'" data-msg="'+esc(p.id+":"+mi)+'"><div class="av">'+(isU?"🧑":"🩺")+'</div><div class="bd">'
       +'<div class="nm"><span>'+esc(isU?t("you"):t("doctor"))+(m.edited?' <span class="pfOpt">'+esc(t("mem_edited"))+'</span>':'')+"</span>"
       +'<span class="msgActs">'
       +'<button class="msgAct" data-mact="fold" title="'+esc(fold?t("mem_expand"):t("mem_fold"))+'">'+(fold?"🔼":"🔽")+"</button>"
       +'<button class="msgAct" data-mact="edit" title="'+esc(t("pf_edit"))+'">✏️</button>'
       +'<button class="msgAct" data-mact="reopen" title="'+esc(t("mem_reopen"))+'">↩️</button>'
       +'<button class="msgAct danger" data-mact="del" title="'+esc(t("mem_delMsg"))+'">🗑️</button>'
       +"</span></div>"
       +'<div class="tx">'+(fold?('<span class="txFold">'+esc(trunc(stripTags(m.t),120))+"</span>"):(isU?esc(m.t):renderAI(m.t)))+"</div>"
       +'<div class="dt">'+esc(timeStr(m.d))+"</div></div></div>";
    });
  }
  h+="</div>";
  h+='<div class="patSec"><h3>📁 '+esc(t("mem_reports"))+' <span class="pfOpt">'+cases.length+"</span></h3>";
  if(!cases.length) h+='<p class="empty">'+esc(t("mem_empty"))+"</p>";
  cases.slice().reverse().forEach(c=>{
    h+='<div class="patCase"><div class="ch">🩺 '+esc(dateStr(c.date))+" · "+esc(c.cc||"")+"</div><p>"+esc(String(c.assessment||"").slice(0,260))+"…</p>"
     +'<div class="patActs"><button class="bubAct" data-patdl="'+esc(String(c.date))+'">📄 '+esc(t("dlWord"))+"</button></div></div>";
  });
  h+="</div></div>";
  body.innerHTML=h;
  body.querySelectorAll("[data-patact]").forEach(b=>{
    const a=b.dataset.patact;
    b.onclick=()=>{ if(a==="active"){ patSetActive(p.id); renderMem(); } else if(a==="close"){ patClose(); } else if(a==="del"){ patDelFile(p.id); } else if(a==="dl"){ patDownload(p); } else if(a==="xl"){ downloadCasesExcel(p.id); } else if(a==="rename"){ patRename(p.id); } };
  });
  body.querySelectorAll("[data-patdl]").forEach(b=>{
    b.onclick=()=>{ const c=cases.find(x=>String(x.date)===b.dataset.patdl); if(c) downloadWordDoc({patientName:c.pname||p.name||"", profileLines:c.pl||[], assessment:String(c.assessment||"")+(c.pearl?("\n\n💡 "+t("docPearl")+": "+c.pearl):""), date:c.date}); };
  });
  body.querySelectorAll("[data-msg]").forEach(row=>{
    const parts=String(row.dataset.msg).split(":");
    const pid=parts.slice(0,-1).join(":");
    const idx=parseInt(parts[parts.length-1],10);
    row.querySelectorAll("[data-mact]").forEach(btn=>{
      const act=btn.dataset.mact;
      btn.onclick=(ev)=>{ ev.stopPropagation();
        if(act==="fold") patToggleFold(pid,idx);
        else if(act==="edit") patEditMsg(pid,idx);
        else if(act==="reopen") patReopenMsg(pid,idx);
        else if(act==="del") patDelMsg(pid,idx);
      };
    });
  });
}
function addFact(){
  const inp=document.getElementById("factInput");
  const v=inp.value.trim(); if(!v) return;
  const facts=load("omni_facts",[]); facts.push(v); save("omni_facts",facts);
  inp.value=""; renderMem();
}
function clearMemory(fromSettings){
  if(!confirm(t("mem_clear")+"?")) return;
  localStorage.removeItem("omni_cases"); localStorage.removeItem("omni_pearls"); localStorage.removeItem("omni_facts"); localStorage.removeItem("omni_profile");
  localStorage.removeItem("omni_patients"); localStorage.removeItem("omni_active_patient");
  renderMem(); if(fromSettings) document.getElementById("settingsModal").hidden=true;
}

function pfFtIn(cm){ const inch=cm/2.54; let ft=Math.floor(inch/12); let inn=Math.round((inch-ft*12)*10)/10; if(inn>=12){ ft++; inn-=12; } return {ft:ft, in:Math.round(inn)}; }
function pfAgeFromDob(y,m,d){
  y=parseInt(y,10); if(!y) return null;
  const bd=new Date(y,(parseInt(m,10)||1)-1,parseInt(d,10)||1);
  if(isNaN(bd.getTime())) return null;
  const now=new Date(); if(bd>now) return null;
  let years=now.getFullYear()-bd.getFullYear(), months=now.getMonth()-bd.getMonth(), days=now.getDate()-bd.getDate();
  if(days<0){ months--; days+=new Date(now.getFullYear(),now.getMonth(),0).getDate(); }
  if(months<0){ years--; months+=12; }
  const totalDays=Math.max(0,Math.floor((now-bd)/86400000));
  return {years:years,months:months,days:days,totalDays:totalDays,weeks:Math.floor(totalDays/7)};
}
function pfAgeText(a){
  if(!a) return "";
  if(a.years>=2) return a.years+" "+t("pf_years");
  if(a.years>=1) return a.years+" "+t("pf_years")+" "+a.months+" "+t("pf_months");
  if(a.months>=1) return a.months+" "+t("pf_months")+" "+a.days+" "+t("pf_days");
  if(a.totalDays>=14) return a.weeks+" "+t("pf_weeks")+" "+a.days+" "+t("pf_days");
  return a.totalDays+" "+t("pf_days");
}
function pfCompute(){
  let ageText="", ageObj=null;
  if(pfG("dobMode")==="age"){
    const y=+pfG("ageY")||0,m=+pfG("ageM")||0,w=+pfG("ageW")||0,d=+pfG("ageD")||0;
    const parts=[]; if(y)parts.push(y+" "+t("pf_years")); if(m)parts.push(m+" "+t("pf_months")); if(w)parts.push(w+" "+t("pf_weeks")); if(d)parts.push(d+" "+t("pf_days"));
    ageText=parts.join(" ");
  } else { ageObj=pfAgeFromDob(pfG("dobY"),pfG("dobM"),pfG("dobD")); ageText=pfAgeText(ageObj); }
  let heightCm=null, heightDisp="";
  if(pfG("heightUnit")==="ft"){ const ft=+pfG("heightFt")||0, inc=+pfG("heightIn")||0; if(ft||inc) heightCm=Math.round((ft*12+inc)*2.54); }
  else { const cm=+pfG("heightCm")||0; if(cm) heightCm=cm; }
  if(heightCm){ const fi=pfFtIn(heightCm); heightDisp=(pfG("heightUnit")==="ft")?(heightCm+" "+t("pf_cm")+" ("+fi.ft+"′"+fi.in+"″)"):(fi.ft+"′"+fi.in+"″ — "+heightCm+" "+t("pf_cm")); }
  let weightKg=null, weightDisp="";
  if(pfG("weightUnit")==="lb"){ const lb=+pfG("weightVal")||0; if(lb) weightKg=Math.round(lb/2.20462*10)/10; }
  else { const kg=+pfG("weightVal")||0; if(kg) weightKg=kg; }
  if(weightKg){ const lb=Math.round(weightKg*2.20462*10)/10; weightDisp=(weightKg+" "+t("pf_kg")+" ("+lb+" "+t("pf_lb")+")"); }
  return {ageText:ageText, ageObj:ageObj, heightCm:heightCm, heightDisp:heightDisp, weightKg:weightKg, weightDisp:weightDisp};
}

function pfGetGps(){
  const out=document.getElementById("pfGpsOut"), btn=document.getElementById("pfGpsBtn");
  if(!navigator.geolocation){ toast(t("pf_gps_err")); return; }
  if(btn) btn.disabled=true; if(out) out.textContent=t("pf_gps_busy");
  navigator.geolocation.getCurrentPosition(async pos=>{
    const la=Math.round(pos.coords.latitude*1e5)/1e5, lo=Math.round(pos.coords.longitude*1e5)/1e5;
    pfDraft.lat=la; pfDraft.lon=lo;
    if(out) out.textContent="📍 "+la+", "+lo;
    try{
      const j=await (await root.superFetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+la+"&longitude="+lo+"&localityLanguage="+(LANG==="ar"?"ar":"en"))).json();
      if(j){
        const cc=j.countryCode||"";
        if(cc&&COUNTRY_BY_ISO[cc]){ pfDraft.resCountry=cc; const sel=document.querySelector('[data-pf="resCountry"]'); if(sel) sel.value=cc; }
        const city=j.city||j.locality||"";
        if(city){ pfDraft.resCity=city; const i1=document.querySelector('[data-pf="resCity"]'); if(i1) i1.value=city; }
        let dist="";
        if(j.localityInfo&&Array.isArray(j.localityInfo.administrative)){
          const ad=j.localityInfo.administrative.filter(x=>x&&x.name&&x.order>=2&&x.order<=6).sort((a,b)=>b.order-a.order)[0];
          if(ad&&ad.name!==city){ dist=ad.name; pfDraft.resDistrict=dist; const i2=document.querySelector('[data-pf="resDistrict"]'); if(i2) i2.value=dist; }
        }
        if(out){ const lbl=[city,dist].filter(Boolean).join(" — "); out.textContent="📍 "+((lbl||"")?lbl+" · ":"")+la+", "+lo; }
      }
      toast(t("pf_gps_ok"));
    }catch(e){ toast(t("pf_gps_ok")); }
    if(btn) btn.disabled=false;
  }, err=>{
    if(btn) btn.disabled=false;
    if(out) out.textContent="";
    toast(err&&err.code===1?t("pf_gps_denied"):t("pf_gps_err"));
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
}

let _pfUpBusy=false;
function pfPickUpload(field,kind){
  if(_pfUpBusy) return;

  inp.dataset.field=field;
  inp.accept = kind==="image" ? "image/*" : "application/pdf,.pdf";

}
function pfUpNote(field,msg,kind){
  const ta=document.querySelector('.pfArea[data-pf="'+field+'"]'); if(!ta||!ta.parentElement) return;
  const n=ta.parentElement.querySelector(".pfUpNote"); if(!n) return;
  n.textContent=msg||""; n.className="pfUpNote"+(kind?" "+kind:"");
}
async function pfExtractField(field,file){
  const sys="You are a careful medical data-entry assistant that fills in a patient's personal health file. "
   +"Extract ONLY information that is actually present in the uploaded document — never invent, guess or add anything. "
   +"Always answer in "+langName(LANG)+".";
  const user="Target health-file field: \""+t("pf_f_"+field)+"\".\nWhat this field should contain: "+t("pf_"+field+"_ph")
   +"\n\nRead the attached document and output ONLY the information that belongs in this field, as short plain-text lines, "
   +"ready to paste directly into the field. No title, no markdown, no bullet symbols, no notes, no explanation. "
   +"Keep every medicine dose and every value/number exactly as written. If the document contains nothing relevant to this field, output exactly: NONE";
  const ext=(String(file.name).split(".").pop()||"").toLowerCase();
  if(/^image\//.test(file.type)||/\.(png|jpe?g|gif|webp|bmp|heic)$/i.test(ext)){
    const imgData=await fileToB64(file,1500);
    return await askAI(sys,user,{mime:imgData.mime,b64:imgData.b64});
  }
  let text="";
  if(ext==="pdf"||file.type==="application/pdf") text=await extractPdfText(file);
  else if(ext==="docx"||/wordprocessingml/.test(file.type)) text=await extractDocxText(file);
  else text=await readMaybeText(file);
  text=String(text||"").replace(/\n{3,}/g,"\n\n").trim();
  if(!text) throw new Error("empty");
  return await askAI(sys, user+"\n\n--- DOCUMENT TEXT ---\n"+text.slice(0,24000));
}
async function pfHandleUpload(){
  const inp=document.getElementById("pfUploadInput"); if(!inp) return;
  const files=[...(inp.files||[])]; inp.value="";
  const field=inp.dataset.field; if(!files.length||!field) return;
  if(aiBusy){ toast(t("busy_wait")); return; }
  const ta=document.querySelector('.pfArea[data-pf="'+field+'"]'); if(!ta) return;
  const card=ta.closest(".pfCard");
  _pfUpBusy=true;
  if(card){ card.classList.add("pfUpBusy"); card.querySelectorAll(".pfUp").forEach(b=>b.disabled=true); }
  let added=0, none=0;
  try{
    for(let i=0;i<files.length;i++){
      pfUpNote(field, t("pf_read_reading"), "busy");
      try{
        let out=await pfExtractField(field,files[i]);
        out=String(out||"").trim().replace(/^NONE[.\s!…]*$/i,"").trim();
        if(!out){ none++; continue; }
        const cur=String(ta.value||"").trim();
        ta.value = cur ? cur+"\n"+out : out;
        pfDraft[field]=ta.value;
        added++;
      }catch(e){}
    }
  }finally{
    _pfUpBusy=false;
    if(card){ card.classList.remove("pfUpBusy"); card.querySelectorAll(".pfUp").forEach(b=>b.disabled=false); }
  }
  pfRefresh();
  if(added>0){ pfUpNote(field, t("pf_read_done"), "ok"); toast(t("pf_read_done")); }
  else if(none>0){ pfUpNote(field, t("pf_read_none"), "warn"); toast(t("pf_read_none")); }
  else { pfUpNote(field, t("pf_read_fail"), "warn"); toast(t("pf_read_fail")); }
}

function pfEditFile(id){ const d=pfLoad(id); if(!d) return; pfDraft=d; pfShowForm(); }

function pfDelFile(id){ if(!confirm(t("pf_confirm_del"))) return; const a=pfAll().filter(f=>f.id!==id); pfSaveAll(a); if(pfActiveId()===id) pfSetActive(a[0]?a[0].id:""); pfShowList(); }
function pfSaveFile(isDraft){
  const name=String(pfG("name")).trim();
  if(!name){ toast(t("pf_need_name")); return; }
  const c=pfCompute(), files=pfAll();
  const id=pfDraft.id || ("h"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const rec=Object.assign({}, pfDraft, {id:id, name:name, computed:c, updated:Date.now(), draft:!!isDraft});
  rec.contacts=pfContacts();
  delete rec.lastUpdated;
  const i=files.findIndex(f=>f.id===id);
  if(i>=0) files[i]=rec; else files.push(rec);
  pfSaveAll(files); pfSetActive(id);
  toast(isDraft? t("pf_draft_ok") : t("pf_saved_ok"));
  pfShowList();
}
function pfHealthText(f){
  if(!f) return "";
  const c=f.computed||{};
  const L=[]; const add=(k,v)=>{ if(v&&String(v).trim()) L.push(k+": "+String(v).replace(/\s+/g," ").trim()); };
  add("Name", f.name); add("Contact", f.contact); add("Age", c.ageText); add("Sex", f.sex);
  add("Ancestry", f.ancestry); add("Height", c.heightDisp); add("Weight", c.weightDisp);
  const rc=f.resCountry?(COUNTRY_BY_ISO[f.resCountry]?countryName(f.resCountry,false):f.resCountry):"";
  add("Residence (country, city, area)", [rc,f.resCity,f.resDistrict].filter(Boolean).join(", "));
  if(f.lat&&f.lon) add("Residence GPS", f.lat+", "+f.lon+" (https://www.google.com/maps/search/?api=1&query="+f.lat+","+f.lon+")");
  const pcs=pfContacts(f);
  if(pcs.length) add("Emergency contacts (name, relation, phone)", pcs.map(x=>[x.name,x.relation,x.phone].filter(Boolean).join(" ")).join("; "));
  add("Conditions", f.conditions); add("Medications & supplements", f.meds); add("Allergies", f.allergies);
  add("Surgeries", f.surgeries); add("Family history", f.family); add("Lifestyle", f.lifestyle);
  add("Tests", f.tests); add("Other", f.other);
  return "Patient health file on record:\n"+L.join("\n");
}

  });

  vsel.appendChild(none);
  vs.slice().sort((a,b)=>{
    const al=a.lang.replace(/_/g,"-").slice(0,2).toLowerCase()===curLang?0:1;
