<style>
:root{
  --teal:#00a3a3;
  --blue:#2a6fd6;
  --violet:#8a3ffc;
  --brand:#1e5fce;
  --brand-d:#17419e;
  --grad:linear-gradient(135deg,#00a3a3 0%,#2a6fd6 52%,#8a3ffc 100%);
  --grad-2:linear-gradient(120deg,#00a3a3,#2a6fd6);
  --ink:#0f2557;
  --ink-2:#3a4d78;
  --muted:#6b7a99;
  --tint:#eef3ff;
  --tint-2:#e2ecff;
  --line:#dbe5fb;
  --line-2:#c8d9fa;
  --page:#f5f9ff;
  --page-2:#f7f3ff;
  --sh:0 6px 20px rgba(31,63,145,.08);
  --hdr:110px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Tajawal','Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,var(--page) 0%,var(--page-2) 100%);color:var(--ink);text-align:left;display:flex;flex-direction:column;height:100vh;overflow:hidden}
[dir=rtl] body{text-align:right}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
a{color:var(--brand)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}

.screen{display:none;flex-direction:column}
.screen.on{display:flex;flex:1;min-height:0}

/* ===== language screen ===== */
#langScreen.on{align-items:center;justify-content:center;padding:20px;overflow-y:auto;background:radial-gradient(1000px 520px at 50% -8%,#e7f5ff 0%,transparent 62%),radial-gradient(760px 460px at 85% 112%,#f2eaff 0%,transparent 58%)}
.langCard{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 70px rgba(31,63,145,.16);padding:34px 26px 28px;max-width:540px;width:100%;text-align:center}
.logoImg{width:104px;height:104px;border-radius:26px;margin:0 auto 14px;object-fit:cover;box-shadow:0 12px 30px rgba(42,111,214,.3);display:block}
.langCard h1{font-size:27px;color:var(--brand-d);font-weight:800;letter-spacing:.2px}
.langCard .sub{color:var(--brand);font-size:15px;font-weight:700;margin-top:5px}
.langCard .tagline{color:var(--muted);font-size:13px;margin:10px 0 20px;line-height:1.65}
.langCard .choose{font-weight:800;color:var(--ink);margin-bottom:12px;font-size:14px}
.langGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.langBtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 6px;border-radius:14px;background:var(--tint);border:1px solid var(--line);transition:.15s}
.langBtn:hover{background:var(--tint-2);border-color:var(--line-2);transform:translateY(-2px)}
.langBtn .fl{font-size:22px}
.langBtn .ln{font-size:13px;font-weight:700;color:var(--brand)}

/* ===== header ===== */
header{background:var(--grad);color:#fff;padding:10px 12px 9px;display:flex;flex-direction:column;gap:9px;flex-shrink:0;box-shadow:0 6px 22px rgba(19,42,105,.26);position:relative;z-index:30}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
.hRow{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:38px;direction:ltr}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;white-space:nowrap;min-width:0}
.brand img{width:36px;height:36px;border-radius:11px;flex-shrink:0;box-shadow:0 4px 12px rgba(6,20,60,.3)}
.brand span{overflow:hidden;text-overflow:ellipsis}
.iconbtn{font-size:18px;width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(4px);transition:.15s}
.iconbtn:hover{background:rgba(255,255,255,.3)}
.iconbtn:active{transform:scale(.94)}
.tabs{display:flex;gap:6px;overflow-x:auto;justify-content:safe center;padding:4px;background:rgba(9,22,58,.16);border-radius:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 12px;border-radius:11px;font-size:12.5px;font-weight:700;white-space:nowrap;color:#e4f2ff;flex-shrink:0;transition:.15s}
.tab:hover{background:rgba(255,255,255,.14)}
.tab.on{background:#fff;color:var(--brand-d);box-shadow:0 3px 10px rgba(6,20,60,.22)}

/* ===== main ===== */
main{flex:1;min-height:0;position:relative}
section{display:none;height:100%;overflow-y:auto;padding:14px;max-width:880px;margin:0 auto}
section.on{display:block}
.disclaimer{background:linear-gradient(90deg,#fff7ec,#fffaf4);border-bottom:1px solid #f3ddc2;color:#96551a;font-size:11.5px;font-weight:700;padding:7px 12px;text-align:center}

/* chat */
.chatToolbar{display:flex;gap:8px;align-items:center;padding:8px 0}
.chatToolbar .toolBtn{background:var(--tint);color:var(--brand);font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:11px;transition:.15s}
.chatToolbar .toolBtn:hover{background:var(--tint-2)}
.chatToolbar .spacer{flex:1}
#chatBox{display:flex;flex-direction:column;gap:10px;padding:6px 2px 12px}
.bub{display:flex;gap:8px;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bub .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--tint)}
.bub.user{flex-direction:row-reverse}
.bub.user .av{background:#d8fbf3}
.bub .bc{max-width:82%;background:#fff;border:1px solid var(--line);border-radius:15px;padding:9px 12px;box-shadow:var(--sh)}
.bub.user .bc{background:var(--grad-2);border-color:transparent;color:#fff}
.bub .who{font-size:10.5px;font-weight:800;color:var(--brand);margin-bottom:3px}
.bub.user .who{color:#d6e9ff}
.bub .txt{font-size:14px;line-height:1.65;word-break:break-word}
.bub .txt .li{margin-left:6px}
.bub .txt b{color:inherit}
.bubActs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bubAct{display:flex;align-items:center;gap:5px;background:var(--tint);border:1px solid var(--line-2);color:var(--brand);font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:18px;transition:.15s}
.bubAct:hover{background:var(--brand);border-color:var(--brand);color:#fff}
#toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:700;z-index:90;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
#toast.show{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{padding:8px 14px;border-radius:20px;background:var(--tint);border:1px solid var(--line-2);color:var(--brand);font-size:13px;font-weight:700;transition:.15s}
.chip:hover{background:var(--brand);border-color:var(--brand);color:#fff;transform:translateY(-1px)}
.typing{display:flex;gap:5px;padding:4px 2px}
.typing span{width:7px;height:7px;border-radius:50%;background:#a9c4f5;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
.cur{display:inline-block;width:8px;height:15px;background:var(--brand);border-radius:2px;vertical-align:-2px;margin:0 2px;animation:blink .9s infinite}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.inputRow{display:flex;gap:8px;align-items:center;padding:10px 0 4px;position:sticky;bottom:0;background:linear-gradient(180deg,rgba(245,249,255,0),var(--page) 32%)}
.pendingBar{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 2px}
.pendChip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line-2);border-radius:12px;padding:4px 7px;font-size:12px;color:var(--brand-d);font-weight:700;max-width:230px;box-shadow:var(--sh)}
.pendChip .pcThumb{width:28px;height:28px;border-radius:8px;object-fit:cover;flex-shrink:0}
.pendChip .pcIc{flex-shrink:0;font-size:14px}
.pendChip .pcNm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:145px}
.pendChip .pcX{border:none;background:#fee2e2;color:#b91c1c;border-radius:7px;width:20px;height:20px;font-size:11px;line-height:1;cursor:pointer;flex-shrink:0;padding:0}
#chatInput{flex:1;border:1.5px solid var(--line);border-radius:22px;padding:11px 16px;font-size:14px;background:#fff;outline:none;transition:.15s}
#chatInput:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(42,111,214,.12)}
.iconRound{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 16px rgba(42,111,214,.32);transition:.15s}
#fileBtn{background:linear-gradient(135deg,#8a3ffc,#6d28d9)}
#camBtn{background:linear-gradient(135deg,#2a6fd6,#1d55ad)}
.iconRound.green{background:linear-gradient(135deg,#00a3a3,#0fbfae)}
.iconRound:hover{transform:scale(1.05)}
.iconRound:active{transform:scale(.96)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}70%{box-shadow:0 0 0 16px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.iconRound.green.listening{background:#dc2626;animation:pulse 1s infinite}

/* chat fills the screen; input bar pinned to the very bottom */
#chatTab.on{display:flex;flex-direction:column;overflow:hidden}
#chatTab #chatBox{flex:1;min-height:0;overflow-y:auto}
#chatTab .inputRow{position:static;flex-shrink:0;padding-bottom:10px}

/* memory card */
#memoryCard{position:fixed;top:var(--hdr,110px);left:50%;transform:translateX(-50%);width:min(560px,92vw);background:var(--grad);color:#fff;border-radius:20px;padding:18px 18px 14px;z-index:35;box-shadow:0 18px 50px rgba(19,42,105,.42);animation:drop .5s ease}
[dir=rtl] #memoryCard{left:50%;right:auto}
@keyframes drop{from{opacity:0;transform:translateX(-50%) translateY(-24px)}to{opacity:1;transform:translateX(-50%)}}
#memoryCard .mcHead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px}
#memoryCard .mcHead img{width:30px;height:30px;border-radius:8px}
#memoryCard p{font-size:13px;line-height:1.7;margin:10px 0 12px;color:#e8f3ff}
#mcStart{background:#fff;color:var(--brand-d);font-weight:800;padding:11px 22px;border-radius:14px;font-size:14px}
#mcStart:hover{transform:scale(1.03)}
#mcClose{position:absolute;top:10px;right:12px;color:#dbeaff;font-size:20px}
[dir=rtl] #mcClose{right:auto;left:12px}

/* rec bar */
#recBar{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;font-weight:700;padding:9px 18px;border-radius:24px;z-index:40;font-size:13px;box-shadow:0 8px 24px rgba(220,38,38,.4);display:flex;align-items:center;gap:8px}
#recBar .dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s infinite}

/* MCQ */
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.panel h2{font-size:17px;color:var(--brand-d);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.panel .hint{font-size:12.5px;color:var(--muted);line-height:1.6}
.typebadge{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;margin:2px 0 8px}
.trenal{background:#fef3c7;color:#92400e}
.thepatic{background:#fce7f3;color:#9d174d}
.tinter{background:#fee2e2;color:#991b1b}
.ttdm{background:#dbeafe;color:#1e40af}
.tivpo{background:#dcfce7;color:#166534}
.tpeds{background:#f3e8ff;color:#6b21a8}
.tnodrug{background:#f0fdf4;color:#15803d}
.thla{background:#cffafe;color:#1e5fce}
.story{font-size:14px;line-height:1.7;margin:8px 0}
.labs{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px}
.labs th{background:var(--grad-2);color:#fff;padding:7px;font-size:12px}
.labs td{border:1px solid var(--line);padding:7px;text-align:center}
.labs tr.abn td:first-child{background:#fff1f1}
.labs td.hi{color:#dc2626;font-weight:800}
.labs td.lo{color:#b45309;font-weight:800}
.labs td.normal{color:#16a34a}
.mcqQ{font-weight:800;font-size:14.5px;margin:8px 0;color:var(--ink)}
.opt{display:block;width:100%;text-align:left;background:#f8fafc;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin:7px 0;font-size:13.5px;line-height:1.5;transition:.12s}
[dir=rtl] .opt{text-align:right}
.opt:hover:not(:disabled){border-color:var(--brand);background:var(--tint)}
.opt:disabled{cursor:default;opacity:.75}
.opt.right{background:#dcfce7;border-color:#16a34a}
.opt.wrong{background:#fee2e2;border-color:#dc2626}
.reveal{background:var(--tint);border:1px solid var(--line-2);border-radius:12px;padding:12px;margin-top:10px;font-size:13.5px;line-height:1.7}
.reveal .ref{font-size:12px;color:var(--brand);font-weight:800;margin-top:6px}
.bigBtn{background:var(--grad);color:#fff;font-weight:800;padding:12px 22px;border-radius:14px;font-size:14px;width:100%;margin-top:10px;box-shadow:0 6px 16px rgba(42,111,214,.26)}
.bigBtn:hover{filter:brightness(1.05)}

/* directory */
.dirSearch{display:flex;gap:8px;margin-bottom:10px}
#dirInput{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;background:#fff;outline:none}
.filterRow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{padding:7px 13px;border-radius:20px;background:var(--tint);color:var(--brand);font-size:12.5px;font-weight:700;border:1px solid var(--line-2)}
.fchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.erCard{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;font-weight:700}
.erCard .big{font-size:20px}
.placeCard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--sh)}
.placeCard .pn{font-weight:800;font-size:14.5px;color:var(--ink)}
.placeCard .pm{font-size:12px;color:var(--muted);margin:3px 0}
.placeCard .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:6px}
.tag.hosp{background:#dbeafe;color:#1e40af}
.tag.clin{background:#dcfce7;color:#166534}
.tag.doc{background:#fef3c7;color:#92400e}
.placeActs{display:flex;gap:8px;margin-top:9px}
.miniBtn{flex:1;text-align:center;background:var(--tint);color:var(--brand);font-weight:700;font-size:12.5px;padding:8px;border-radius:10px;transition:.15s}
.miniBtn.green{background:#dcfce7;color:#166534}
.miniBtn:hover{filter:brightness(.95)}
.dirSub{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.dirSub::-webkit-scrollbar{display:none}
.dirSub button{flex-shrink:0;background:var(--tint);color:var(--brand);font-weight:700;font-size:12px;padding:7px 12px;border-radius:20px;border:1px solid var(--line-2)}
.dirSub button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.dirGovSel{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;background:#fff;margin-bottom:10px;color:var(--ink)}
.tag.ctr{background:#ede9fe;color:#5b21b6}
.tag.poly{background:#cffafe;color:#1e5fce}
.tag.lab{background:#fce7f3;color:#9d174d}
.tag.pharm{background:#e0f2fe;color:#0369a1}
.det{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
.det .pm{font-size:12.5px;color:#334155;line-height:1.75}
.det a{word-break:break-all}
.det .secT{font-weight:800;color:var(--brand);font-size:12.5px;margin:8px 0 3px}
.artBody{font-size:13px;line-height:1.9;color:#1e293b}
.artBody p{margin:8px 0}
.artBody img{max-width:100%;border-radius:10px;height:auto}
.artBody h1,.artBody h2,.artBody h3{color:var(--brand-d);font-size:15px;margin:10px 0 6px}
.altDet{flex:none;padding:8px 16px}

/* health file / profile */
#profileScreen{position:fixed;inset:0;z-index:55;background:linear-gradient(180deg,var(--page) 0%,var(--page-2) 100%);display:none;flex-direction:column}
#profileScreen.on{display:flex}
.pfHead{background:var(--grad);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 6px 22px rgba(19,42,105,.26)}
.pfHead b{font-size:16px}
.pfHead .back{font-size:22px;line-height:1;padding:2px 10px;border-radius:10px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
.pfBody{flex:1;overflow-y:auto;padding:14px;max-width:880px;width:100%;margin:0 auto}
.pfCard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.pfCard h3{color:var(--brand-d);font-size:14.5px;margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pfHint{font-size:11.5px;color:var(--muted);line-height:1.65;margin-bottom:8px}
.pfOpt{font-size:10px;background:var(--tint);color:var(--brand);border-radius:9px;padding:2px 8px;font-weight:800}
.pfLbl{font-size:13px;color:var(--brand)}
.pfUnit{font-size:13px;color:#475569;font-weight:700}
.pfInput,.pfArea,.pfSel{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:#fff;outline:none;color:var(--ink)}
.pfArea{min-height:72px;resize:vertical;line-height:1.65}
.pfUps{margin-inline-start:auto;display:inline-flex;gap:6px}
.pfUp{border:1px solid var(--line-2);background:var(--tint);color:var(--brand);width:31px;height:31px;border-radius:9px;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.15s}
.pfUp:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.pfUp:disabled{opacity:.45;cursor:default}
.pfUpNote{font-size:11.5px;font-weight:700;color:var(--brand);margin-top:5px;min-height:1px}
.pfUpNote.ok{color:#15803d}
.pfUpNote.warn{color:#b45309}
.pfUpNote.busy::after{content:"";display:inline-block;width:8px;height:8px;margin-inline-start:6px;border-radius:50%;background:currentColor;vertical-align:middle;animation:pfPulse .8s infinite}
@keyframes pfPulse{0%,100%{opacity:.25}50%{opacity:1}}
.pfUpBusy .pfArea{opacity:.6}
.pfRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pfNum{width:82px;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;text-align:center;background:#fff;outline:none;color:var(--ink)}
.pfChips{display:flex;gap:7px;flex-wrap:wrap}
.pfChip{padding:8px 14px;border-radius:11px;background:var(--tint);color:var(--brand);font-weight:700;font-size:13px;border:1.5px solid transparent}
.pfChip.on{background:var(--brand);color:#fff}
.pfConv{font-size:12.5px;color:var(--brand);font-weight:700;margin-top:7px;min-height:1px}
.pfActs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pfBtn{flex:1;min-width:120px;background:var(--grad);color:#fff;border-radius:12px;padding:12px;font-weight:800;font-size:14px;box-shadow:0 6px 16px rgba(42,111,214,.24)}
.pfBtn.alt{background:var(--tint);color:var(--brand);box-shadow:none}
.pfBtn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--brand);box-shadow:none}
.pfBtn.warn{background:#fee2e2;color:#b91c1c;box-shadow:none}
.pfFile{background:#f8fbff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pfFile .nm{font-weight:800;color:var(--brand);flex:1;min-width:130px;font-size:14px}

/* ============================================================

/* ---------- محرك الذكاء الاصطناعي ----------
   يعمل التطبيق الآن عبر محرك الذكاء الاصطناعي الرسمي لـ perchance
   (ai-text-plugin) — لا حاجة لأي مفاتيح خارجية (Gemini/Groq/OpenAI).
*/
const LOGO = "https://user.uploads.dev/file/518c250165765ddb567c66c5b8dbd2bf.png";

/* ---------- اللغات ---------- */
const LANGS = [
  ["ar","العربية","🇾🇪","rtl"],["en","English","🇬🇧","ltr"],["fr","Français","🇫🇷","ltr"],
  ["es","Español","🇪🇸","ltr"],["de","Deutsch","🇩🇪","ltr"],["tr","Türkçe","🇹🇷","ltr"],
  ["id","Bahasa Indonesia","🇮🇩","ltr"],["ur","اردو","🇵🇰","rtl"],["fa","فارسی","🇮🇷","rtl"],["hi","हिन्दी","🇮🇳","ltr"],["zh","中文","🇨🇳","ltr"]
];

{bank:"FDA 2026 — Drug interactions",kw:["interaction","warfarin","clopidogrel","omeprazole","simvastatin","clarithromycin","digoxin","amiodarone","methotrexate","trimethoprim","sildenafil","nitrate"],kw_ar:["تداخل","تفاعل","دوائي","وارفارين","كلوبيدوقريل","اوميبرازول","سيمفاستاتين","كلاريثرومايسين","ديغوكسين","اميودارون","ميثوتريكسات","تريميثوبريم"],content:"DEADLY interactions to always flag: (1) warfarin + NSAIDs/co-trimoxazole/fluoroquinolones → INR↑ and bleeding; (2) simvastatin + clarithromycin/azole → rhabdomyolysis (stop statin); (3) clopidogrel + omeprazole → reduced antiplatelet effect; (4) digoxin + amiodarone → digoxin toxicity (halve digoxin, monitor levels); (5) methotrexate + trimethoprim → fatal marrow toxicity; (6) sildenafil/tadalafil + nitrates → hypotension/collapse."},

{bank:"Medscape/Hepatic 2026",kw:["liver","cirrhosis","hepatic","ascites","jaundice","hepatitis","child-pugh","paracetamol","nsaid","valproate"],kw_ar:["كبدي","تليف","تشمع","استسقاء","باراسيتامول","مضادات","الالتهاب"],content:"In cirrhosis/Child-Pugh B/C: paracetamol MAX 2 g/day (safe at low dose, avoid in severe liver failure); avoid NSAIDs (bleeding, hepatorenal, encephalopathy); avoid valproate; morphine cautious (encephalopathy); azithromycin > clarithromycin when macrolide needed. Dose-adjust many drugs (see Child-Pugh)."},

{bank:"Lexicomp/Sanford 2026 — TDM",kw:["tdm","trough","level","therapeutic drug","vancomycin","digoxin","lithium","phenytoin","gentamicin","amikacin","monitor"],kw_ar:["مستوى","الدواء","قمة","فانكومايسين","ديغوكسين","ليثيوم","فينيتوين","جنتامايسين","مراقبة","التركيز"],content:"TDM targets: vancomycin trough 10-15 µg/mL general (15-20 for MRSA bacteremia/endocarditis/pneumonia); digoxin 0.8-2.0 ng/mL; lithium 0.6-1.2 mmol/L; phenytoin total 10-20; aminoglycosides peak/trough per indication. Check trough just before the next dose, after steady state (5 half-lives)."},
{bank:"FDA — HLA-B*5701 / hypersensitivity",kw:["hla","abacavir","hypersensitivity","rash","fever","allergy"],kw_ar:["اباكافير","فرط","حساسية","الطفح","الحساسية","الدوائية"],content:"Test HLA-B*5701 BEFORE starting abacavir (HIV). Positive → NEVER use abacavir (hypersensitivity: fever, rash, GI/respiratory symptoms; rechallenge can be fatal). Document all drug allergies with reaction details; true penicillin allergy is over-reported — assess, but never rechallenge after anaphylaxis."},
{bank:"WHO 2026 — Pediatric",kw:["child","children","pediatric","infant","neonate","aspirin","reye","tetracycline","dose mg/kg","syrup"],kw_ar:["طفل","اطفال","رضيع","حديث","الولادة","جرعة","الاطفال","اسبرين","تتراسيكلين","وزن","الجسم"],content:"Pediatric rules: weight-based dosing ALWAYS (mg/kg), never adult doses; NO aspirin <12y (Reye syndrome); no tetracyclines <8y (teeth staining); fluoroquinolones with caution <18y (cartilage). Recheck all calculations; most pediatric drug errors are dose errors. Rehydration: ORS for mild-moderate dehydration, NOT antibiotics."},
{bank:"FDA 2026 — Pregnancy/lactation",kw:["pregnancy","pregnant","prenatal","teratogen","warfar","ace inhibitor","arb","isotretinoin","valproate","breastfeeding","lactation"],kw_ar:["حمل","حامل","مرضع","رضاعة","تيراتوجين","فالبورات"],content:"Pregnancy: AVOID warfarin (teratogen), ACEi/ARB (2nd/3rd trimester fetopathy), valproate, isotretinoin, NSAIDs in 3rd trimester (premature ductus closure), doxycycline/tetracyclines. SAFE: paracetamol (short term), amoxicillin, cephalexin, azithromycin, insulin. In breastfeeding, most drugs safe but check lactation databases."},
{bank:"Cochrane/NICE 2026 — No-drug cases",kw:["viral","common cold","cough","coryza","runny nose","home care","supportive","flu","no antibiotic","self-limiting"],kw_ar:["فيروسي","نزلة","برد","سعال","زكام","رشح","رعاية","منزلية","تعاف","ذاتي"],content:"Most acute cough/coryza/pharyngitis in children & adults are VIRAL and self-limiting: supportive care (fluids, honey >1y, paracetamol/ibuprofen for fever) — antibiotics cause harm without benefit. Routine antibiotics for acute bronchitis are NOT indicated. Watch for red flags (stridor, respiratory distress, dehydration)."},
{bank:"Herbal/Qat interactions (regional)",kw:["qat","khat","shammah","herb","herbal","black seed","nigella","fenugreek","pomegranate","حبة","حلبة","رمان","قات","شمة"],kw_ar:["قات","شمة","حلبة","حبة","سوداء","رمان","اعشاب","عشبة","يمنية"],content:"Yemen-specific: QAT (khat, cathinone) is a sympathomimetic — raises BP/HR, may interact with MAOIs/TCAs, worsens insomnia; consider in anesthesia (hypertension) and in patients with cardiac disease. BLACK SEED (thymoquinone) may increase bleeding risk with anticoagulants and lower BP/glucose. FENUGREEK can cause hypoglycemia when added to antidiabetics (metformin/sulfonylureas) — watch for falls. POMEGRANATE peel/juice may affect CYP3A-metabolized drugs. Always ask about herbs and adjust expectations."},
{bank:"KDIGO 2026 — Hyperkalemia & fluids",kw:["potassium","hyperkalemia","hypokalemia","hyponatremia","electrolyte","kalium","k+","sodium","na+","fluid"],kw_ar:["بوتاسيوم","فرط","البوتاسيوم","صوديوم","كهارل","سوائل","الجفاف"],content:"Acute hyperkalemia (K>6.0 or ECG changes): calcium gluconate FIRST (cardiac protection), then insulin+glucose and/or salbutamol (shift K+ in), then binders/dialysis to remove. Hyponatremia: correct slowly (≤8-10 mmol/L per 24h) — fast correction causes osmotic demyelination. Never give rapid IV fluids with glucose alone in young children (hyponatremia risk) — use ORS/balanced solutions."},
{bank:"AHA 2026 — ACS & stroke",kw:["chest pain","myocardial","mi","acs","stroke","thrombolys","tia","aspirin","nitroglycerin","hemiparesis","fast"],kw_ar:["الم","صدري","ذبحة","جلطة","قلبية","احتشاء","نتروغليسيرين","سكتة","دماغية","شلل","نصفي"],content:"ACS: aspirin 300mg chewed immediately, ECG within 10 min, anticoagulation, troponin; PCI preferred over fibrinolysis when timely. Stroke: think FAST (Face, Arm, Speech, Time); CT first; thrombolysis (alteplase/tenecteplase) within 4.5h of onset if eligible; endovascular thrombectomy for large vessel occlusion; control BP per protocol (do NOT crash-lower in acute stroke)."},
{bank:"AHA 2025 — ACLS/emergency",kw:["cpr","cardiac arrest","resuscitat","shock","defibrillat","epinephrine","amiodarone","acl","bradycardia","vfib"],kw_ar:["انعاش","قلبي","صدمة","كهربائية","ادرينالين","توقف","القلب"],content:"Cardiac arrest: high-quality CPR 30:2 (2 min cycles), defibrillate shockable rhythms (VF/pVT) ASAP, epinephrine 1 mg q3-5 min, amiodarone for refractory VF/pVT. Post-ROSC: targeted temperature management, oxygenation goal 94-98%. Sepsis: give IV fluids (balanced crystalloid) + broad-spectrum antibiotics within 1 hour of recognition; draw lactate and cultures first."},
{bank:"WHO 2026 — Pain",kw:["pain","analgesic","paracetamol","ibuprofen","opioid","morphine","tramadol","migraine","lumbago","back pain"],kw_ar:["الم","مسكن","باراسيتامول","ايبوبروفين","مورفين","ترامادول","صداع","نصفي","الم","الظهر"],content:"WHO analgesic ladder: start paracetamol/NSAID; escalate to weak/strong opioids only when needed, short courses. AVOID tramadol + SSRIs/SNRIs (serotonin syndrome) and tramadol with opioids. For acute low back pain: stay active, paracetamol/NSAID, NO routine opioids or imaging. Migraine: triptans + NSAID; avoid opioids. Always pair opioid use with laxatives."},
{bank:"WHO 2026 — Vaccines & anaphylaxis",kw:["vaccine","immunization","tetanus","childhood","anaphylaxis","epinephrine","adrenaline","penicillin"],kw_ar:["لقاح","تطعيم","تحصين","كزاز","حساسية","مفرطة","انافيلاكسيس"],content:"Anaphylaxis: IM epinephrine (adrenaline) 0.01 mg/kg (max 0.5 mg) IMMEDIATELY in the anterolateral thigh; repeat q5-15 min; IV fluids; call for help — do NOT wait for antihistamines/steroids. Routine WHO immunization: BCG, HepB, polio, DTP, Hib, pneumococcal, rotavirus, measles/rubella in infancy; tetanus booster every 10 years."},
{bank:"WHO EML — Anemia & nutrition",kw:["anemia","iron","ferritin","hb ","hemoglobin","folate","b12","pale","fatigue"],kw_ar:["فقر","دم","انيميا","حديد","فيريتين","هيموغلوبين","شحوب","فولات"],content:"Anemia workup: CBC + ferritin. Ferritin <30 ng/mL = iron deficiency even with normal Hb — treat iron (oral first; IV if intolerant/refractory). In pregnancy, prophylactic iron+folic acid is WHO standard. B12/folate deficiency needs replacement; never give folate alone to B12-deficient (masks neuro complications)."},
{bank:"2026 Surgical updates (old vs new)",kw:["surgery","surgical","operation","laparoscopic","open surgery","hernia","appendicitis","cholecystectomy","wound","er", "incision","جراحة"],kw_ar:["جراحة","عمليات","تنظير","فتق","زائدة","مرارة","جروح","عملية","جراحية"],content:"Modern surgical practice vs outdated teaching: laparoscopic/minimally-invasive techniques (cholecystectomy, appendectomy, hernia, colorectal) reduce wound infection, pain and stay vs old open approaches. Tension-free mesh for adult inguinal hernia (Lichtenstein/laparoscopic) beats old tissue-suture repair (fewer recurrences). ERAS protocols (early feeding, early mobilization, minimal fasting, no routine drains/nasogastric tubes) cut complications vs old 'nil-by-mouth + drains' practice. Negative-pressure wound therapy and newer absorbable sutures/staples improve outcomes; prophylactic antibiotics given ONCE within 60 min of incision (not 'pre-op night + 5 days post-op')."},
{bank:"COVID-19 & respiratory 2026",kw:["covid","corona","pneumonia","dyspnea","shortness","breath","oxygen","spo2","pulse oximeter","influenza"],kw_ar:["كوفيد","كورونا","ضيق","التنفس","اكسجين","انفلونزا"],content:"Acute dyspnea/fever: assess oxygen saturation (SpO2<94% or falling = needs care), respiratory rate, work of breathing. COVID-19: antivirals (nirmatrelvir-ritonavir) in high-risk within 5 days; symptomatic care otherwise; immunocompromised may need specific therapy. Influenza: oseltamivir if high-risk and early. Always exclude hypoxia with pulse oximetry at home when possible."},
{bank:"GINA/GOLD 2026 — Asthma & COPD",kw:["asthma","wheeze","inhaler","salbutamol","copd","bronchitis","smoking","saba","ics"],kw_ar:["ربو","ازيز","صفير","استنشاق","سالبوتامول","تدخين"],content:"Asthma (GINA): ICS-formoterol as needed (or ICS maintenance + as-needed), NEVER SABA-only monotherapy. Exacerbation: inhaled bronchodilators + early oral prednisolone 40-50mg for 5-7 days. COPD (GOLD): LAMA+LABA bronchodilators; add ICS only if frequent exacerbations/eosinophilia; long-term oxygen if PaO2≤55 or SpO2≤88%; acute exacerbation antibiotics only if increased purulence/infection."},
{bank:"Harrison's — Diarrhea & dehydration",kw:["diarrhea","vomiting","dehydration","ors","rehydration","stool","bloody stool","dysentery","cholera"],kw_ar:["اسهال","اقياء","استفراغ","قيء","جفاف","املاح","معوية"],content:"Acute diarrhea: ORS after every loose stool (children: 50-100 mL per stool); zinc 10-20 mg/day for children (WHO). Antibiotics only for dysentery (bloody), cholera, or severe/prolonged cases. Anti-motility drugs (loperamide) avoid in bloody diarrhea/fever. Red flags: sunken eyes, no tears, skin turgor loss, lethargy → IV fluids."},
{bank:"Anatomy — Musculoskeletal (Gray's / TeachMeAnatomy)",kw:["bone","bone ","skeleton","muscle","joint","fracture","spine","vertebra","femur","tibia","humerus","skull","ligament","tendon","cartilage","salter"],kw_ar:["عظم","عظام","عضلة","عضلات","مفصل","مفاصل","كسر","فقرات","عمود","فقري","هيكل","أربطة","وتر"],content:"Skeleton: 206 bones = axial (skull, vertebral column 7C/12T/5L/sacrum/coccyx, ribs, sternum) + appendicular (limbs, girdles). Joint types: fibrous (sutures), cartilaginous (IV discs), synovial (knee, shoulder — most mobile). Muscle = origin/insertion/action/nerve supply. Fracture description: open vs closed, site, displacement, angulation, comminuted, spiral, greenstick (children). Physeal injuries: Salter-Harris I–V ('SALTR'). Compartment syndrome = the 5 P's: Pain (out of proportion, worse on stretch), Pallor, Paresthesia, Pulselessness (late), Paralysis (late) — a surgical emergency. REF: Gray's Anatomy; TeachMeAnatomy; Radiopaedia."},
{bank:"Anatomy — Neuroanatomy (Gray's / UTHealth)",kw:["brain","neuro","nerve","cranial","spinal cord","cerebrum","cerebellum","brainstem","lobe","dermatome","reflex","stroke anatomy","cortex","neuron"],kw_ar:["دماغ","عصب","أعصاب","قحفي","نخاع","مخ","مخيخ","جذع","فص","جلد","انعكاس","قشرة","عصبون"],content:"CNS = brain + spinal cord; PNS = 12 cranial nerves + 31 spinal nerve pairs. Lobes: frontal (executive, motor, Broca), parietal (sensory, neglect), temporal (hearing, Wernicke/memory), occipital (vision), cerebellum (coordination/balance), brainstem (vital centres). Cranial nerves I–XII: 'Oh Oh Oh To Touch And Feel Very Good Velvet, Ah Heaven'. UMN signs = hypertonia, hyperreflexia, Babinski+, spasticity; LMN signs = hypotonia, hyporeflexia, atrophy, fasciculations. Circle of Willis gives collateral supply; MCA stroke = contralateral face/arm weakness + aphasia (dominant). Dermatomes C5 thumb, C6 thumb/index, T4 nipple, T10 umbilicus, L4 medial malleolus, S1 lateral foot. REF: Neuroanatomy Online (UTHealth); Gray's Anatomy."},
{bank:"Anatomy — Cardiovascular & Respiratory (Gray's / Radiopaedia)",kw:["heart","cardiac","valve","coronary","aorta","ventricle","atrium","lung","pulmonary","bronchus","pleura","diaphragm","respiratory","auscultation","mitral"],kw_ar:["قلب","صمام","شريان","تاجي","أورطي","بطين","أذين","رئة","رئوي","قصبة","شعبة","جنب","حجاب","سمع","تسمع","تاجية"],content:"Heart: 4 chambers, 4 valves (tricuspid, pulmonary, mitral, aortic). Coronary arteries: LAD (anterior wall/septum), LCx (lateral wall), RCA (inferior wall/right ventricle + SA/AV nodes). Conduction: SA node → AV node → bundle of His → left/right bundle branches → Purkinje. Murmur timing: systolic = aortic/pulmonary stenosis or mitral/tricuspid regurgitation; diastolic = aortic regurgitation or mitral stenosis. Lungs: right 3 lobes (upper/middle/lower), left 2 + lingula; trachea → main bronchi → lobar → segmental. Auscultation: apex (mitral) 5th ICS MCL; tricuspid lower left sternal edge; pulmonary 2nd ICS left; aortic 2nd ICS right. REF: Gray's Anatomy; Radiopaedia."},
{bank:"Anatomy — Gastrointestinal & Renal (Gray's)",kw:["stomach","liver","intestine","colon","gallbladder","bile","pancreas","kidney","renal","ureter","bladder","nephron","appendix","esophagus","portal"],kw_ar:["معدة","كبد","امعاء","قولون","مرارة","صفراء","بنكرياس","كلية","كلى","حالب","مثانة","نفرون","زائدة","مريء","بابي"],content:"GI tract: mouth → esophagus → stomach (fundus/body/antrum) → duodenum → jejunum → ileum → cecum → ascending/transverse/descending/sigmoid colon → rectum → anus. Liver: 8 Couinaud segments, dual supply (portal vein ~75% flow + hepatic artery), portal triad (portal vein, hepatic artery, bile duct). Biliary: right/left hepatic ducts → common hepatic → cystic → CBD → ampulla of Vater. Appendix at McBurney's point (1/3 from ASIS to umbilicus). Kidney: cortex, medulla (pyramids), pelvis; nephron = glomerulus + tubules. Ureter narrowing at 3 points: pelvi-ureteric junction, pelvic brim, vesico-ureteric junction (stone impaction). REF: Gray's Anatomy; TeachMeAnatomy."},
{bank:"Anatomy — Endocrine & Reproductive + Special Senses (Gray's)",kw:["thyroid","pituitary","adrenal","hormone","ovary","uterus","testis","prostate","pregnancy anatomy","eye","ear","retina","optic","cochlea","eustachian"],kw_ar:["غدة","درقية","نخامية","كظرية","هرمون","مبيض","رحم","خصية","بروستات","عين","شبكية","اذن","قوقعة","اوستاش"],content:"Endocrine: pituitary (sella turcica, hypo/hyper function), thyroid (Isthmus over 2nd–4th tracheal rings; recurrent laryngeal nerve runs in tracheo-esophageal groove — at risk in thyroidectomy), parathyroids (calcium), adrenals (cortex: aldosterone/cortisol/androgens; medulla: catecholamines), pancreatic islets (insulin/glucagon). Female: ovaries → fallopian tubes → uterus (fundus/body/cervix) → vagina; pregnancy anatomy (uterine growth, placental circulation). Male: testes → epididymis → vas deferens → seminal vesicles → prostate → urethra; prostate surrounds urethra (BPH → obstruction). Eye: fibrous (sclera/cornea), vascular (choroid/ciliary/iris), neural (retina); optic nerve CN II. Ear: external (pinna/canal) → middle (tympanic membrane, malleus/incus/stapes) → inner (cochlea, vestibule, semicircular canals); Eustachian tube vents middle ear (dysfunction in children → otitis media). REF: Gray's Anatomy; TeachMeAnatomy."}

   يقرأ ملفات CSV من src/YemenMd_tables (الملفات الكبيرة مستثناة لتبقى الحزمة خفيفة).
*/
const YEM_BASE="src/YemenMd_tables/";
const _yemCache={}; let _yemGovRows=null, _yemSeq=0;
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){ const c=text.charCodeAt(i);
    if(q){ if(c===34){ if(text.charCodeAt(i+1)===34){cur+='"';i++;} else q=false; } else cur+=text[i]; }
    else { if(c===34) q=true; else if(c===44){ row.push(cur); cur=""; } else if(c===10){ row.push(cur); rows.push(row); row=[]; cur=""; } else if(c===13){} else cur+=text[i]; }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
async function yText(file){
  const r=await fetch(YEM_BASE+file);
  if(!r.ok) throw new Error("HTTP "+r.status);
  if(/\.gz$/i.test(file)){
    if(typeof DecompressionStream==="undefined") throw new Error("gzip unsupported");
    const stream=r.body.pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).text();
  }
  return await r.text();
}
async function yLoad(file){
  if(_yemCache[file]) return _yemCache[file];
  const pr=(async()=>{
    const rows=parseCSV(await yText(file)); const hdr=(rows[0]||[]).map(x=>x.trim()), out=[];
    for(let i=1;i<rows.length;i++){ const rr=rows[i]; if(!rr.length) continue; const o={}; for(let j=0;j<hdr.length;j++) o[hdr[j]]=rr[j]===undefined?"":rr[j]; out.push(o); }
    return out;
  })();
  _yemCache[file]=pr;
  try{ return await pr; }catch(e){ delete _yemCache[file]; throw e; }
}
function yMap(rows,key){ const m={}; for(const r of rows) m[r[key]]=r; return m; }
function stripTags(s){ return String(s||"").replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/\s+/g," ").trim(); }
function yPhone(v){ const s=String(v||"").trim(); if(!s) return ""; return (s.split(/\s*[-/،,]\s*/)[0]||"").replace(/[^\d+]/g,""); }
function yMaps(q){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q); }
function yPlaceMaps(r,gname){ const lat=parseFloat(r.lat), lng=parseFloat(r.lng); if(lat&&lng) return yMaps(lat+","+lng); return yMaps(String(r.name||"").trim()+" "+(r.address||"")+" "+(gname||"")+" اليمن"); }

function flagEmoji(iso){ if(!/^[A-Za-z]{2}$/.test(iso)) return "🏳️"; try{ const A=0x1F1E6, cp=[...iso.toUpperCase()].map(c=>A+(c.charCodeAt(0)-65)); if(cp.some(x=>x<A||x>A+25)) return "🏳️"; return String.fromCodePoint.apply(null,cp); }catch(e){ return "🏳️"; } }
function countryName(iso,useAr){ const c=COUNTRY_BY_ISO[iso]; if(!c) return iso||""; return (useAr===undefined?ar():useAr)?(c[2]||c[1]):(c[1]||c[2]); }
function countryLabel(iso){ return flagEmoji(iso)+" "+countryName(iso); }
function isoFromName(s){
  s=String(s||"").trim(); if(!s) return "";
  if(/^[A-Za-z]{2}$/.test(s)) return s.toUpperCase();
  const k=s.toLowerCase(); if(COUNTRY_BY_NAME[k]) return COUNTRY_BY_NAME[k];
  const hit=COUNTRIES.find(c=>(c[2]&&s.includes(c[2]))||(c[1]&&k.includes(c[1].toLowerCase())));
  return hit?hit[0]:"";
}
async function whText(file){
  const r=await fetch(WH_BASE+file);
  if(!r.ok) throw new Error("HTTP "+r.status);
  if(/\.gz$/i.test(file)){
    if(typeof DecompressionStream==="undefined") throw new Error("gzip unsupported");
    const stream=r.body.pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).text();
  }
  return await r.text();
}
async function whLoad(){
  if(_whCache.rows) return _whCache.rows;
  if(_whCache.pr) return _whCache.pr;
  const pr=(async()=>{
    const rows=parseCSV(await whText(WH_FILE)); const hdr=(rows[0]||[]).map(x=>x.trim()), out=[];
    for(let i=1;i<rows.length;i++){ const rr=rows[i]; if(!rr||!rr.length||!rr[0]) continue; const o={}; for(let j=0;j<hdr.length;j++) o[hdr[j]]=rr[j]===undefined?"":rr[j]; out.push(o); }
    return out;
  })();
  _whCache.pr=pr;
  try{ const rows=await pr; _whCache.rows=rows; _whCache.pr=null; _whCache.counts=null; return rows; }catch(e){ _whCache.pr=null; throw e; }
}
function whCounts(){ if(_whCache.counts) return _whCache.counts; const m={}; const rows=_whCache.rows; if(rows) for(const r of rows) m[r.iso]=(m[r.iso]||0)+1; _whCache.counts=m; return m; }
function haversineKm(la1,lo1,la2,lo2){
  if(!isFinite(la1)||!isFinite(lo1)||!isFinite(la2)||!isFinite(lo2)) return NaN;
  const R=6371, D=Math.PI/180, dLa=(la2-la1)*D, dLo=(lo2-lo1)*D;
  const a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*D)*Math.cos(la2*D)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
}
function whName(r){ const arN=String(r.ar||"").trim(), enN=String(r.name||"").trim(); return (ar()&&arN)?arN:(enN||arN); }
function whAltName(r){ const arN=String(r.ar||"").trim(), enN=String(r.name||"").trim(); if(!arN||arN===enN) return ""; return (ar()&&arN)?enN:arN; }

}

let _nearCache={k:"__",v:"",t:0};
async function nearbyYemen(lat,lon,city,district){
  const [est,gov,spec,crews]=await Promise.all([yLoad("establishments.csv"),yLoad("governorates.csv"),yLoad("specialties.csv"),yLoad("crews.csv")]);
  const gMap=yMap(gov,"id"), sMap=yMap(spec,"id"), eMap=yMap(est,"id");
  const txt=(String(city||"")+" "+String(district||"")).trim().toLowerCase();
  const picked=[];
  if(lat!=null&&lon!=null){
    est.forEach(r=>{ const d=haversineKm(lat,lon,parseFloat(r.lat),parseFloat(r.lng)); if(isFinite(d)) picked.push({r:r,d:d}); });
    picked.sort((a,b)=>a.d-b.d);
  }
  let rows=picked.slice(0,6).map(x=>x.r);
  if(!rows.length && txt) rows=est.filter(r=>{ const g=gMap[r.governorate_id]; return yMatch(txt,[r.name,r.address,(g&&g.name)||""]); }).slice(0,6);
  const L=rows.map(r=>{
    const g=gMap[r.governorate_id], sp=sMap[r.major_id], ty=YEM_EST_TYPE[r.type]||["",""];
    const d=haversineKm(lat,lon,parseFloat(r.lat),parseFloat(r.lng));
    return "- "+(ty[0]?t(ty[0])+" ":"")+r.name+(g?" — "+g.name:"")+(isFinite(d)?" — "+Math.round(d*10)/10+" "+t("dir_km"):"")+(sp?" — "+sp.name:"")+(r.phone?" — tel "+yPhone(r.phone):"")+" — "+yPlaceMaps(r,g&&g.name);
  });
  const dl=[];
  crews.forEach(c=>{ const e=eMap[c.establishment_id]; if(!e) return; const g=gMap[e.governorate_id], sp=sMap[c.specialty_id];
    const d=haversineKm(lat,lon,parseFloat(e.lat),parseFloat(e.lng));
    const mCity=txt?yMatch(txt,[g&&g.name,e.name,e.address||""]):false;
    if(isFinite(d)||mCity) dl.push({c:c,e:e,g:g,sp:sp,d:isFinite(d)?d:1e6,m:mCity});
  });
  dl.sort((a,b)=>(b.m?1:0)-(a.m?1:0)||a.d-b.d);
  const doctors=dl.slice(0,4).map(x=>"- "+x.c.name+(x.sp?" ("+x.sp.name+")":"")+(x.g?" — "+x.g.name:"")+(x.e?" — "+x.e.name:"")+(x.c.phone?" — tel "+yPhone(x.c.phone):""));
  let out="";
  if(L.length) out+="NEAREST Yemen-directory hospitals/clinics (nearest first):\n"+L.join("\n")+"\n";
  if(doctors.length) out+="Yemeni doctors closest to the residence:\n"+doctors.join("\n")+"\n";
  if(!out) out="No Yemen directory entry matched the residence — advise the nearest governorate hospital and the 997 ambulance number.\n";
  return out;
}
async function nearbyWorld(iso,lat,lon){
  const rows=await whLoad();
  const m0=iso?rows.filter(r=>r.iso===iso):rows.slice();
  if(lat==null||lon==null){
    return "Residence country: "+(iso?countryName(iso,false):"?")+" — "+m0.length+" hospitals on record, but there is NO GPS for the residence, so ask the patient for their city/area and recommend accordingly.\n";
  }
  const m=m0.map(r=>Object.assign({},r,{_d:haversineKm(lat,lon,parseFloat(r.lat),parseFloat(r.lon))})).filter(x=>isFinite(x._d)).sort((a,b)=>a._d-b._d).slice(0,6);
  if(!m.length) return "No hospital coordinates found for this country — recommend the nearest major city hospital.\n";
  return "NEAREST hospitals in the world database"+(iso?" ("+countryName(iso,false)+")":"")+", nearest first:\n"+m.map(r=>"- "+whName(r)+" — "+(Math.round(r._d*10)/10)+" km — https://www.google.com/maps/search/?api=1&query="+r.lat+","+r.lon+(r.site?" — "+r.site:"")).join("\n")+"\n";
}
async function nearbyContext(){
  const h=pfActive();
  let iso="", city="", district="", lat=null, lon=null;
  if(h){ const la=parseFloat(h.lat), lo=parseFloat(h.lon); lat=isFinite(la)?la:null; lon=isFinite(lo)?lo:null; iso=h.resCountry||""; city=String(h.resCity||"").trim(); district=String(h.resDistrict||"").trim(); }
  if(!iso && flowData && flowData.country) iso=isoFromName(flowData.country);
  if(!iso && !city && lat==null) return "";
  const key=[iso,city,district,lat,lon].join("|");
  if(_nearCache.k===key && Date.now()-_nearCache.t<600000) return _nearCache.v;
  let out="";
  try{
    if(iso==="YE") out=await nearbyYemen(lat,lon,city,district);
    else out=await nearbyWorld(iso,lat,lon, city);
  }catch(e){ out=""; }
  if(out){ const loc=[countryName(iso,false),city,district].filter(Boolean).join(", "); out="Patient's residence: "+(loc||"unknown")+(lat!=null?" (GPS "+lat+", "+lon+")":"")+"\n"+out; }
  _nearCache={k:key,v:out,t:Date.now()};
  return out;
}

function worldCard(r){
  let h='<div class="pn">🏥 '+esc(whName(r))+' <span class="tag hosp">'+esc(t("dir_hosp"))+"</span></div>";
  const alt=whAltName(r); if(alt) h+=yMeta("🔤",alt);
  if(r._d!==undefined && isFinite(r._d)) h+=yMeta("📍",t("dir_near")+" — "+(Math.round(r._d*10)/10)+" "+t("dir_km"));
  const acts=[], la=parseFloat(r.lat), lo=parseFloat(r.lon);
  if(isFinite(la)&&isFinite(lo)) acts.push(yMapBtn(yMaps(la+","+lo)));
  if(r.site) acts.push('<a class="miniBtn" target="_blank" rel="noopener" href="'+esc(r.site)+'">🔗 '+esc(t("dir_website"))+"</a>");
  h+=yActs(acts);

async function renderWorld(list, done){
  let rows;
  try{ rows=await whLoad(); }
  catch(e){ if(done()) list.innerHTML='<p class="empty">'+esc(t("dir_world_none"))+" — "+esc(String(e&&e.message||e))+"</p>"; return; }
  if(!done()) return;
  dirCountryFill();
  const iso=YDIR.country, q=YDIR.q;
  let m=rows.filter(r=>r.iso===iso);
  if(q) m=m.filter(r=>(String(r.name||"")+" "+String(r.ar||"")).toLowerCase().includes(q));
  const res=residence();
  if(res&&res.lat!=null&&res.lon!=null){
    m=m.map(r=>Object.assign({},r,{_d:haversineKm(res.lat,res.lon,parseFloat(r.lat),parseFloat(r.lon))})).filter(x=>isFinite(x._d)).sort((a,b)=>a._d-b._d);
  } else m=m.slice().sort((a,b)=>whName(a).localeCompare(whName(b),LANG));
  if(!m.length){ list.innerHTML='<p class="empty">'+esc(t("dir_world_none"))+"</p>"; return; }
  yRender(list,m,worldCard);
}
let _dirCFillKey="";
function dirCountryFill(){
  const sel=document.getElementById("dirCountry"); if(!sel) return;
  const key=LANG+"|"+(_whCache.rows?"1":"0");
  if(_dirCFillKey===key){ if(sel.value!==YDIR.country) sel.value=YDIR.country; return; }
  _dirCFillKey=key;
  const cnt=whCounts();
  const rest=COUNTRIES.filter(c=>c[0]!=="YE").slice().sort((a,b)=>countryName(a[0]).localeCompare(countryName(b[0]),LANG));
  let h='<option value="YE">'+esc(flagEmoji("YE")+" "+countryName("YE")+(cnt.YE?" ("+cnt.YE+")":""))+"</option>";
  rest.forEach(c=>{ h+='<option value="'+c[0]+'">'+esc(flagEmoji(c[0])+" "+countryName(c[0])+(cnt[c[0]]?" ("+cnt[c[0]]+")":""))+"</option>"; });

}

/* ---------- الذكاء الاصطناعي (محرك perchance) ---------- */
function b64ToBlob(b64, mime){
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes],{type:mime||"image/jpeg"});
}
async function askAI(system, user, image, opts){
  opts=opts||{};
  let instruction;
  if(image){
    const blob=b64ToBlob(image.b64, image.mime);
    instruction=[system+"\n\nUSER MESSAGE:\n"+user, "\n\nThe user attached the following medical image (prescription / labs / ECG / imaging). Please analyze it carefully.", blob];
  } else {
    instruction=system+"\n\nUSER MESSAGE:\n"+user;
  }
  const genOpts={instruction};
  if(opts.onChunk) genOpts.onChunk=(d)=>{ opts.onChunk(String(d.fullTextSoFar||"")); };
  const maxAttempts = opts.retries ? opts.retries : 3;
  let lastErr;
  for(let attempt=1; attempt<=maxAttempts; attempt++){
    try{
      const result=await root.generateText(genOpts);
      const txt=String((result&&result.text!==undefined)?result.text:result).trim();
      if(!txt) throw new Error("empty response");
      return txt;
    }catch(e){
      lastErr=e;
      if(attempt<maxAttempts) await new Promise(r=>setTimeout(r, 800*attempt));
    }
  }
  throw new Error(lastErr&&lastErr.message?lastErr.message:lastErr);
}

/* ---------- بنوك المعرفة RAG ---------- */
function retrieveKB(text){
  const lower = " " + String(text||"").toLowerCase() + " ";
  const hits=[];
  for(const e of KB){
    let s=0;
    for(const k of (e.kw||[])){ if(lower.includes(k)) s++; }
    for(const k of (e.kw_ar||[])){ if(lower.includes(k)) s+=1; }
    if(s>0) hits.push({e,s});
  }
  hits.sort((a,b)=>b.s-a.s);
  return hits.slice(0,5).map(h=>"["+h.e.bank+"] "+h.e.content).join("\n\n");
}

function mdToHtml(txt){
  const lines=String(txt||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").split("\n");
  let out="", open=false;
  for(const raw of lines){
    const m=raw.match(/^[ \t]*[-•]\s?(.*)/);
    const bold=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
    if(m){
      if(!open){ out+="<ul style=\"margin:6px 0;padding-right:24px;padding-left:24px\">"; open=true; }
      out+="<li style=\"margin:3px 0\">"+bold(m[1])+"</li>";
    } else {
      if(open){ out+="</ul>"; open=false; }
      if(String(raw).trim()) out+="<p style=\"margin:6px 0;line-height:1.7\">"+bold(raw)+"</p>";
    }
  }
  if(open) out+="</ul>";
  return out;
}

/* ---------- ZIP (طريقة التخزين، بلا ضغط) ---------- */
let _oxCrc=null;
function oxCrc32(u8){
  if(!_oxCrc){ _oxCrc=new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); _oxCrc[n]=c>>>0; }
  }
  let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c=_oxCrc[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function oxU8(x){ return (x instanceof Uint8Array)?x:(typeof x==="string"?new TextEncoder().encode(x):new Uint8Array(x)); }
function oxZip(files){
  const enc=new TextEncoder(), chunks=[], central=[];
  let offset=0;
  const time=0, date=((2026-1980)<<9)|(1<<5)|1;
  for(const f of files){
    const name=enc.encode(f.name), data=oxU8(f.data), crc=oxCrc32(data);
    const lh=new Uint8Array(30+name.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0x0800,true);
    lv.setUint16(8,0,true); lv.setUint16(10,time,true); lv.setUint16(12,date,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,name.length,true); lv.setUint16(28,0,true);
    lh.set(name,30);
    chunks.push(lh,data);
    const ch=new Uint8Array(46+name.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(12,time,true); cv.setUint16(14,date,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,name.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true); cv.setUint32(42,offset,true);
    ch.set(name,46);
    central.push(ch);
    offset+=lh.length+data.length;
  }
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const eocd=new Uint8Array(22), ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,offset,true);
  return new Blob([].concat(chunks,central,[eocd]),{type:"application/octet-stream"});
}
function oxSave(blob,name,mime){
  const out=mime?new Blob([blob],{type:mime}):blob;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(out); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(e){} a.remove(); },5000);
}

function xesc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c])); }
const W_NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
const W_FONT='<w:rFonts w:ascii="Segoe UI" w:hAnsi="Segoe UI" w:cs="Tahoma"/>';
function wRun(text,o){
  o=o||{};
  let rpr=W_FONT;
  if(o.b) rpr+="<w:b/>";
  if(o.i) rpr+="<w:i/>";
  if(o.color) rpr+='<w:color w:val="'+o.color+'"/>';
  if(o.sz) rpr+='<w:sz w:val="'+o.sz+'"/><w:szCs w:val="'+o.sz+'"/>';
  if(o.rtl) rpr+="<w:rtl/>";
  return "<w:r><w:rPr>"+rpr+"</w:rPr>"+'<w:t xml:space="preserve">'+xesc(text)+"</w:t></w:r>";
}
function wRuns(text,o){
  o=o||{};
  const parts=String(text==null?"":text).split(/(\*\*[^*]+\*\*)/g);
  return parts.map(seg=>{
    if(/^\*\*[^*]+\*\*$/.test(seg)) return wRun(seg.slice(2,-2),Object.assign({},o,{b:true}));
    return wRun(seg,o);
  }).join("");
}
function wPara(content,o){
  o=o||{};
  const p=[];
  if(o.border) p.push("<w:pBdr>"+o.border+"</w:pBdr>");
  if(o.shd) p.push('<w:shd w:val="clear" w:color="auto" w:fill="'+o.shd+'"/>');
  if(o.rtl) p.push("<w:bidi/>");
  p.push('<w:spacing '+(o.spacing||'w:after="80"')+"/>");
  if(o.ind) p.push("<w:ind "+o.ind+"/>");
  if(o.align) p.push('<w:jc w:val="'+o.align+'"/>');
  return "<w:p><w:pPr>"+p.join("")+"</w:pPr>"+(content||"")+"</w:p>";
}
function mwBlocks(txt,o){
  o=o||{};
  const rtl=!!o.rtl, out=[], lines=String(txt||"").replace(/\r/g,"").split("\n");
  for(const raw of lines){
    const line=raw.replace(/\s+$/,"");
    if(!line.trim()){ out.push('<w:p><w:pPr>'+(rtl?"<w:bidi/>":"")+'<w:spacing w:after="40"/></w:pPr></w:p>'); continue; }
    let m;
    if((m=line.match(/^#{1,6}\s+(.*)$/))){
      out.push(wPara(wRuns(m[1],{b:true,sz:26,color:"17419e",rtl:rtl}),{rtl:rtl,spacing:'w:before="180" w:after="80"'})); continue;
    }
    if((m=line.match(/^\s*[-•*]\s+(.*)$/))){
      out.push(wPara(wRun("• ",{b:true,color:"2a6fd6",rtl:rtl})+wRuns(m[1],{rtl:rtl}),{rtl:rtl,ind:'w:start="340" w:hanging="220"',spacing:'w:after="40"'})); continue;
    }
    if((m=line.match(/^\s*(\d+)[.)]\s+(.*)$/))){
      out.push(wPara(wRun(m[1]+". ",{b:true,color:"2a6fd6",rtl:rtl})+wRuns(m[2],{rtl:rtl}),{rtl:rtl,ind:'w:start="340" w:hanging="220"',spacing:'w:after="40"'})); continue;
    }
    if(line.length<=72 && /[:：]\s*$/.test(line)){
      out.push(wPara(wRuns(line,{b:true,color:"1e5fce",sz:24,rtl:rtl}),{rtl:rtl,spacing:'w:before="140" w:after="60"'})); continue;
    }
    out.push(wPara(wRuns(line,{rtl:rtl}),{rtl:rtl,align:"both",spacing:'w:after="60"'}));
  }
  return out.join("");
}
function wTable(rows,o){
  o=o||{};
  const rtl=!!o.rtl, n=rows.length?rows[0].length:1;
  const widths=(o.widths&&o.widths.length===n)?o.widths:new Array(n).fill(Math.floor(9500/n));
  let x='<w:tbl><w:tblPr>'+(rtl?"<w:bidiVisual/>":"")
    +'<w:tblW w:w="5000" w:type="pct"/><w:tblBorders>'
    +["top","left","bottom","right","insideH","insideV"].map(s=>'<w:'+s+' w:val="single" w:sz="6" w:space="0" w:color="c8d9fa"/>').join("")
    +"</w:tblBorders>"
    +'<w:tblLayout w:type="fixed"/>'
    +'<w:tblCellMar><w:top w:w="70" w:type="dxa"/><w:left w:w="110" w:type="dxa"/><w:bottom w:w="70" w:type="dxa"/><w:right w:w="110" w:type="dxa"/></w:tblCellMar></w:tblPr>'
    +"<w:tblGrid>"+widths.map(w=>'<w:gridCol w:w="'+w+'"/>').join("")+"</w:tblGrid>";
  rows.forEach((r,ri)=>{
    const head=(ri===0&&o.header!==false);
    x+="<w:tr>"+(head?"<w:trPr><w:tblHeader/></w:trPr>":"");
    for(let ci=0;ci<n;ci++){
      const cell=r[ci];
      const fill=head?"2a6fd6":((o.labelCol&&ci===0)?"eef3ff":((o.zebra&&ri%2===0)?"f7faff":"ffffff"));
      let lines=Array.isArray(cell)?cell:String(cell==null?"":cell).split("\n");
      if(!lines.length) lines=[""];
      const paras=lines.map(ln=>wPara(wRuns(ln,{
        b:head||(o.labelCol&&ci===0),
        color:head?"ffffff":((o.labelCol&&ci===0)?"17419e":"1f2937"),
        sz:head?21:20, rtl:rtl
      }),{rtl:rtl,spacing:'w:after="0"'})).join("");
      x+='<w:tc><w:tcPr><w:tcW w:w="'+widths[ci]+'" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="'+fill+'"/><w:vAlign w:val="center"/></w:tcPr>'+paras+"</w:tc>";
    }
    x+="</w:tr>";
  });
  return x+"</w:tbl>"+wPara("",{rtl:rtl,spacing:'w:after="30"'});
}
function wFld(instr,sz,color,rtl){
  const pr="<w:rPr>"+W_FONT+(color?'<w:color w:val="'+color+'"/>':"")+'<w:sz w:val="'+sz+'"/><w:szCs w:val="'+sz+'"/>'+(rtl?"<w:rtl/>":"")+"</w:rPr>";
  return "<w:r>"+pr+'<w:fldChar w:fldCharType="begin"/></w:r>'
    +"<w:r>"+pr+'<w:instrText xml:space="preserve"> '+instr+" </w:instrText></w:r>"
    +"<w:r>"+pr+'<w:fldChar w:fldCharType="separate"/></w:r>'
    +"<w:r>"+pr+"<w:t>1</w:t></w:r>"
    +"<w:r>"+pr+'<w:fldChar w:fldCharType="end"/></w:r>';
}

async function oxLogoBytes(){
  try{
    const r=await fetch(LOGO,{mode:"cors"});
    if(r.ok){ const b=new Uint8Array(await r.arrayBuffer()); if(b.length>8) return b; }
  }catch(e){}
  return null;
}

async function buildWordDoc(data){
  data=data||{};
  const rtl=ar();
  const prof=data.profileLines||[];
  const assessment=String(data.assessment||"");
  const messages=Array.isArray(data.messages)?data.messages:[];
  const cases=Array.isArray(data.cases)?data.cases:[];
  const logo=await oxLogoBytes();
  const body=[];
  body.push(wPara(wRun(t("docTitle"),{b:true,sz:44,color:"17419e",rtl:rtl}),{rtl:rtl,align:"center",spacing:'w:after="40"'}));
  body.push(wPara(wRun(t("docTag"),{sz:18,color:"6b7a99",rtl:rtl}),{rtl:rtl,align:"center",spacing:'w:after="20"'}));
  body.push(wPara(wRun(t("docDate")+": "+oxFmtDT(data.date||Date.now()),{sz:18,b:true,color:"2a6fd6",rtl:rtl}),{rtl:rtl,align:"center",spacing:'w:after="60"'}));
  if(data.patientName){
    body.push(wPara(wRun(t("docPatientName")+": "+data.patientName,{sz:22,b:true,color:"0f2557",rtl:rtl}),{rtl:rtl,align:"center",spacing:'w:after="160"'}));
  }
  body.push(wPara(wRun("📋 "+t("docPatient"),{b:true,sz:26,color:"17419e",rtl:rtl}),{rtl:rtl,spacing:'w:before="120" w:after="80"'}));
  if(prof.length) body.push(wTable(prof.map(r=>[String(r[0]==null?"":r[0]),String(r[1]==null?"":r[1])]),{rtl:rtl,header:false,labelCol:true,widths:[2900,6600]}));
  else body.push(wPara(wRun("—",{rtl:rtl}),{rtl:rtl}));
  if(messages.length){
    body.push(wPara(wRun("💬 "+t("docMessages"),{b:true,sz:26,color:"17419e",rtl:rtl}),{rtl:rtl,spacing:'w:before="200" w:after="80"'}));
    const rows=[[t("docNo"),t("docRole"),t("docTime"),t("docText")]];
    messages.forEach((m,i)=>rows.push([String(i+1), m.role==="u"?t("you"):t("doctor"), oxFmtDT(m.date), String(m.text||"")]));
    body.push(wTable(rows,{rtl:rtl,widths:[600,1500,2400,5000],zebra:true}));
  }
  if(assessment.trim()){
    body.push(wPara(wRun("🩺 "+t("docAssessment"),{b:true,sz:26,color:"17419e",rtl:rtl}),{rtl:rtl,spacing:'w:before="200" w:after="80"'}));
    body.push(mwBlocks(assessment,{rtl:rtl}));
  }
  if(cases.length){
    body.push(wPara(wRun("🗂️ "+t("docCases"),{b:true,sz:26,color:"17419e",rtl:rtl}),{rtl:rtl,spacing:'w:before="220" w:after="80"'}));
    const rows=[[t("docNo"),t("docTime"),t("docCC"),t("docAssessment"),t("docPearl")]];
    cases.slice().sort((a,b)=>(a.date||0)-(b.date||0)).forEach((c,i)=>rows.push([
      String(i+1), oxFmtDT(c.date), String(c.cc||""), String(c.assessment||""), String(c.pearl||"")
    ]));
    body.push(wTable(rows,{rtl:rtl,widths:[600,1400,1700,4000,1800],zebra:true}));
  }
  body.push(wPara(wRun(t("docEmergency"),{b:true,sz:22,color:"7f1d1d",rtl:rtl}),{rtl:rtl,shd:"FEE2E2",spacing:'w:before="240" w:after="60"'}));
  body.push(wPara(wRun(t("docSignature")+": ______________________          "+t("docStamp")+": _____________",{sz:20,color:"334155",rtl:rtl}),{rtl:rtl,spacing:'w:before="360" w:after="120"'}));
  body.push(wPara(wRun(t("docDisclaimer"),{sz:16,color:"9a3412",rtl:rtl}),{rtl:rtl,shd:"FFF7ED",spacing:'w:after="0"'}));
  return packDocx(body.join(""),rtl,t("docTitle"),logo);
}
async function downloadWordDoc(data){
  const blob=await buildWordDoc(data);
  oxSave(blob,"Dr-Omni-AI-Report-"+oxStamp()+".docx","application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  toast(t("docSaved"));
}

const X_NS='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
function xCol(n){ let s=""; n=Math.floor(n); while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function xSheet(sheet,rtl,first){
  const rows=sheet.rows;
  const maxCols=rows.reduce((m,r)=>Math.max(m,r.length),1);
  const dim="A1:"+xCol(maxCols)+Math.max(rows.length,1);
  const widths=sheet.widths||[];
  const cols=widths.length?"<cols>"+widths.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join("")+"</cols>":"";
  const body=rows.map((r,ri)=>{
    const rn=ri+1;
    const cells=r.map((v,ci)=>{
      if(v==null||v==="") return "";
      const ref=xCol(ci+1)+rn, style=ri===0?"1":"2";
      if(typeof v==="number") return '<c r="'+ref+'" s="'+style+'"><v>'+v+"</v></c>";
      return '<c r="'+ref+'" s="'+style+'" t="inlineStr"><is><t xml:space="preserve">'+xesc(v)+"</t></is></c>";
    }).join("");
    return '<row r="'+rn+'"'+(ri===0?' ht="28" customHeight="1"':"")+">"+cells+"</row>";
  }).join("");
  const name=xesc(String(sheet.name||"Sheet").replace(/[\[\]\*\?\/\\:]/g," ").slice(0,31));
  return {name:name,xml:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +"<worksheet "+X_NS+">"
    +'<dimension ref="'+dim+'"/>'
    +"<sheetViews><sheetView"+(rtl?' rightToLeft="1"':"")+(first?' tabSelected="1"':"")+' workbookViewId="0"/></sheetViews>'
    +'<sheetFormatPr defaultRowHeight="16"/>'+cols
    +"<sheetData>"+body+"</sheetData>"
    +'<autoFilter ref="A1:'+xCol(maxCols)+"1\"/>"
    +"</worksheet>"};
}
const X_STYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
 +'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'

 +'<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Segoe UI"/></font>'
 +'<font><sz val="11"/><color rgb="FF0F2557"/><name val="Segoe UI"/></font></fonts>'

function isImageFile(f){ return /^image\//.test(f.type)||/\.(png|jpe?g|gif|webp|bmp|heic)$/i.test(String(f.name||"")); }
function addPending(files){

function fileToB64(file,maxW){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height; const sc=Math.min(1,(maxW||1100)/Math.max(w,h));
        w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        res({mime:file.type||"image/jpeg", b64:cv.toDataURL("image/jpeg",0.85).split(",")[1]});
      };
      img.onerror=rej; img.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

}

async function edgeSynthesize(lang,voice,text){

    const parts=[];

    const timer=setTimeout(()=>fail(new Error("edge timeout")),20000);

function splitSpeech(text,max){
  const parts=[], words=String(text).split(/\s+/);
  let cur="";

    if((cur+" "+w).trim().length>max && cur){ parts.push(cur.trim()); cur=w; }
    else cur=(cur?cur+" ":"")+w;
    while(cur.length>max){ parts.push(cur.slice(0,max)); cur=cur.slice(max); }
  }
  if(cur.trim()) parts.push(cur.trim());

function normDrug(s){
  s=String(s||"").toLowerCase();
  s=s.replace(/[\u064B-\u0652\u0670\u0640]/g,"");
  s=s.replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/ة/g,"ه");
  s=s.replace(/[^a-z0-9\u0600-\u06FF]+/g," ").replace(/\s+/g," ").trim();
  return s;
}
const _banRe=(function(){
  const rxEsc=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const parts=[];
  DRUG_BLOCK_AR.forEach(x=>parts.push(rxEsc(normDrug(x))));
  DRUG_BLOCK_EN.forEach(x=>{ const n=normDrug(x); parts.push(n.length<=4?("\\b"+n+"\\b"):n); });
  try{ return new RegExp(parts.join("|")); }catch(e){ return /$^/; }
})();
const _banMemo=new Map();
function isBannedDrug(s){
  if(s===undefined||s===null||s==="") return false;
  if(typeof s!=="string") return false;
  const hit=_banMemo.get(s); if(hit!==undefined) return hit;
  let r=false;
  try{ r=_banRe.test(normDrug(s)); }catch(e){ r=false; }
  if(_banMemo.size>40000) _banMemo.clear();
  _banMemo.set(s,r);
  return r;
}

/* ---------- ترجمة (بحث بالعربية + عرض النشرة بلغة المستخدم) — بدون أي مفاتيح ---------- */
const _trCache={};
function smartChunks(str,limit){
  const SEP="\n\n#\u00a7#\n\n";
  const parts=String(str).split(SEP);
  const groups=[]; let cur=[];
  parts.forEach(p=>{
    const cand=cur.concat([p]).join(SEP);
    if(cur.length && cand.length>limit){ groups.push(cur.join(SEP)); cur=[p]; } else cur.push(p);
  });
  if(cur.length) groups.push(cur.join(SEP));
  const out=[];
  groups.forEach(g=>{
    if(g.length<=limit){ out.push(g); return; }
    let rest=g;
    while(rest.length>limit){
      let cut=rest.lastIndexOf(". ", limit-1);
      if(cut<limit*0.5) cut=limit;
      out.push(rest.slice(0,cut+1)); rest=rest.slice(cut+1);
    }
    if(rest) out.push(rest);
  });
  return out;
}
async function trText(text,to,limit){
  text=String(text||"").trim(); if(!text) return "";
  const from=/[a-z]/i.test(text)?"en":"ar";
  if(from===to) return text;
  const key=from+">"+to+"|"+text.slice(0,400)+"|"+limit;
  if(_trCache[key]!==undefined) return _trCache[key];
  let out=text;
  try{
    const chunks=smartChunks(text,limit||900);
    const parts=await Promise.all(chunks.map(async c=>{
      const j=await (await root.superFetch("https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl="+from+"&tl="+to+"&q="+encodeURIComponent(c))).json();
      if(typeof j==="string") return j;
      if(!Array.isArray(j)) return "";
      if(j.every(x=>typeof x==="string")) return j.filter(x=>!/^[a-z]{2,3}$/.test(x.trim())).join(" ");
      return j.map(x=>Array.isArray(x)&&typeof x[0]==="string"?x[0]:"").join("");
    }));
    const joined=parts.join(" ").replace(/[ \t]+/g," ").trim();
    if(joined) out=joined;
  }catch(e){}
  _trCache[key]=out; return out;
}
/* يترجم عدة مقاطع بطلب واحد ثم يعيد تقسيمها بنفس الترتيب */
async function trBatch(texts,to){
  const arr=(texts||[]).map(x=>String(x||"").trim());
  if(to==="en"||!arr.some(Boolean)) return arr;
  const SEP="\n\n#\u00a7#\n\n";
  const joined=arr.join(SEP);
  if(joined.length>4800) return await Promise.all(arr.map(x=>trText(x,to)));
  const tr=await trText(joined,to,1900);
  const sp=tr.split(/#+\s*\u00a7\s*#+/);
  if(sp.length!==arr.length) return await Promise.all(arr.map(x=>trText(x,to)));
  return sp.map(x=>String(x||"").replace(/^\s+|\s+$/g,""));
}

  if(!hasArabic(q)) return q;
  const en=await trText(q,"en");
  return (en && !hasArabic(en))?en:q;

async function rxNormLookup(q){
  const enc=encodeURIComponent;
  const out={ingredients:[],brands:[],related:[],rxcui:"",blocked:0};
  const [d,a]=await Promise.all([
    jsonGet("https://rxnav.nlm.nih.gov/REST/drugs.json?name="+enc(q)).catch(()=>null),
    jsonGet("https://rxnav.nlm.nih.gov/REST/approximateTerm.json?term="+enc(q)+"&maxEntries=16").catch(()=>null)
  ]);
  const push=(bag,n,cap)=>{ n=String(n||"").trim(); if(!n) return; if(isBannedDrug(n)){ out.blocked++; return; } if(bag.length<cap && !bag.includes(n)) bag.push(n); };
  if(d&&d.drugGroup&&d.drugGroup.conceptGroup) for(const g of d.drugGroup.conceptGroup) for(const p of (g.conceptProperties||[])){
    const tty=g.tty||p.tty||"", nm=String(p.name||"");
    if(nm.indexOf("{")===0) continue;
    if(tty==="BN") push(out.brands,nm,26); else push(out.related,nm,10);
  }
  const rxcuis=[];
  const cands=(a&&a.approximateGroup&&a.approximateGroup.candidate)||[];
  cands.forEach(c=>{ if(c.rxcui && rxcuis.length<3 && rxcuis.indexOf(c.rxcui)<0) rxcuis.push(c.rxcui); push(out.ingredients,c.name,12); });
  if(rxcuis.length){
    const props=await Promise.all(rxcuis.map(id=>jsonGet("https://rxnav.nlm.nih.gov/REST/rxcui/"+id+"/properties.json").catch(()=>null)));
    props.forEach(p=>{
      const pr=p&&p.properties; if(!pr||!pr.name) return;
      if(/^(IN|PIN|MIN)$/.test(pr.tty||"")){ out.rxcui=out.rxcui||pr.rxcui; const nm=String(pr.name).trim(); if(!isBannedDrug(nm)){ const k=out.ingredients.indexOf(nm); if(k>=0) out.ingredients.splice(k,1); out.ingredients.unshift(nm); } else out.blocked++; }
      else push(out.brands,pr.name,26);
    });
  }
  out.related=out.related.concat(out.related.slice(0,6).map(ingOf).filter(x=>x&&x.length>2&&!isBannedDrug(x)&&out.ingredients.indexOf(x)<0)).slice(0,12);
  return out;
}
async function rxClassOf(name){
  try{
    const j=await jsonGet("https://rxnav.nlm.nih.gov/REST/rxclass/class/byDrugName.json?drugName="+encodeURIComponent(name));
    const arr=(j&&j.rxclassDrugInfoList&&j.rxclassDrugInfo)||[];
    const o=[];
    arr.forEach(x=>{ const m=x.rxclassMinConceptItem||{}; const c=[m.className,m.classType].filter(Boolean).join(" · "); if(c&&o.indexOf(c)<0&&o.length<8) o.push(c); });
    return o;
  }catch(e){ return []; }
}
async function fdaLabel(names){
  const base="https://api.fda.gov/drug/label.json?limit=2&search=";
  for(const nm of names.filter(Boolean)){
    const tries=[
      'openfda.generic_name:"'+nm+'" OR openfda.brand_name:"'+nm+'"',
      'openfda.generic_name:"'+nm+'"',
      'openfda.brand_name:"'+nm+'"'
    ];
    for(const s of tries){
      try{ const j=await jsonGet(base+encodeURIComponent(s)); if(j&&j.results&&j.results.length) return j.results; }catch(e){}
    }
  }
  return [];
}

async function lookupDrug(){

  const res=document.getElementById("drugRes");
  if(!res) return;
  if(!raw){ res.innerHTML=""; return; }
  if(isBannedDrug(raw)){ res.innerHTML=bannedHtml(); return; }
  res.innerHTML='<div class="loading">'+esc(t("drug_loading"))+"</div>";
  try{
    const q=(await drugQueryEnglish(raw)).replace(/\s+/g," ").slice(0,80).trim();
    if(!q) throw new Error("empty query");
    if(isBannedDrug(q)){ res.innerHTML=bannedHtml(); return; }
    const rx=await rxNormLookup(q);
    const primary=rx.ingredients[0]||q;
    const fda=await fdaLabel([rx.ingredients[0],q].filter((x,k,arr)=>x&&arr.indexOf(x)===k));
    if(!rx.ingredients.length && !rx.brands.length && !fda.length){
      if(rx.blocked){ res.innerHTML=bannedHtml(); return; }

      return;
    }
    const lab=fda[0]||{}, of=lab.openfda||{};
    const noise=/\b(oral product|pill|oral|product|injectable)\s*$/i;
    const brands=uniqArr([].concat(of.brand_name||[], rx.brands)).filter(n=>!isBannedDrug(n)&&!noise.test(n));
    const generics=uniqArr([].concat(of.generic_name||[], rx.ingredients)).filter(n=>!isBannedDrug(n)&&!noise.test(n));
    const related=uniqArr(rx.related).filter(n=>!isBannedDrug(n)).slice(0,8);

    const secs=[
      ["box",   "⚠️ "+t("drug_warn"),      first(lab.boxed_warning),  700],
      ["ind",   t("drug_uses"),            first(lab.indications_and_usage), 1200],
      ["dose",  t("drug_dose"),            first(lab.dosage_and_administration), 1200],
      ["contra",t("drug_contra"),          first(lab.contraindications), 800],

      ["pedia", t("drug_pedia"),           first(lab.pediatric_use), 500],
      ["geria", t("drug_geria"),           first(lab.geriatric_use), 500],

    ].filter(s=>String(s[2]||"").trim()).map(s=>[s[0],s[1],String(s[2]).replace(/\s+/g," ").trim().slice(0,s[3])]);

    const classesP=rxClassOf(generics[0]||primary);
    let titles=secs.map(s=>s[1]), bodies=secs.map(s=>s[2]);
    if(LANG!=="en" && bodies.length){
      res.innerHTML='<div class="loading">'+esc(t("drug_translating"))+"</div>";
      bodies=await trBatch(bodies,LANG);
    }
    const classes=await classesP;

    let h='<div class="drugcard"><h3>💊 '+esc(primary)+"</h3>"
     +'<p class="gen">'+esc(t("drug_resolved"))+": "+esc(primary)+"</p>";
    h+='<div class="names">';
    if(brands.length) h+="<div><b>"+esc(t("drug_brand"))+":</b> "+esc(brands.slice(0,24).join(" · "))+"</div>";
    if(generics.length) h+="<div><b>"+esc(t("drug_generic"))+":</b> "+esc(generics.slice(0,16).join(" · "))+"</div>";
    const clsList=(classes&&classes.length)?classes:[];
    if(clsList.length) h+="<div><b>"+esc(t("drug_class"))+":</b> "+esc(clsList.join(" · "))+"</div>";
    if(related.length) h+="<div><b>"+esc(t("drug_related"))+":</b> "+esc(related.map(x=>x.length>70?x.slice(0,68)+"…":x).join(" · "))+"</div>";
    h+="</div>";
    if(bodies.length) h+=bodies.map((b,k)=>'<div class="dsec"><h4>'+esc(titles[k])+"</h4><p>"+esc(b)+"</p></div>").join("");
    else h+='<p class="hint">'+esc(t("drug_na"))+" "+esc(t("drug_alt"))+"</p>";
    h+='<div class="drugsrc"><b>'+esc(t("drug_sources"))+":</b> "
     +'<a target="_blank" rel="noopener" href="https://dailymed.nlm.nih.gov/dailymed/search.cfm?labelquery='+enc(primary)+'">📄 DailyMed</a> · '
     +'<a target="_blank" rel="noopener" href="https://open.fda.gov/apis/drug/label/">🗂️ openFDA</a> · '
     +'<a target="_blank" rel="noopener" href="https://mor.nlm.nih.gov/RxNav/search?searchBy=String&searchTerm='+enc(primary)+'">💊 RxNorm</a> · '
     +'<a target="_blank" rel="noopener" href="https://pubmed.ncbi.nlm.nih.gov/?term='+enc(primary)+'">📚 PubMed</a> · '
     +'<a target="_blank" rel="noopener" href="https://www.medscape.com/results?q='+enc(primary)+'">🩺 Medscape</a>'

    if(raw!==q) h='<p class="hint" style="margin-bottom:8px">🌐 '+esc(raw)+" → "+esc(q)+"</p>"+h;

async function collectLive(term, budgetMs){
  term=String(term||"").trim();
  if(!term) return {};
  const budget=budgetMs||9000;
  const q=encodeURIComponent(term);
  const drugTerm=(term.split(/\s+/).filter(Boolean).sort((a,b)=>b.length-a.length)[0]||term);
  const dq=encodeURIComponent(drugTerm);
  const out={};
  const jobs=[
    ["wiki", (async()=>{
      const j=await jfetch("https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+q+"&gsrlimit=3&prop=extracts&exintro=1&explaintext=1&exsentences=3&format=json&origin=*");
      const pages=j.query&&j.query.pages?Object.values(j.query.pages).sort((a,b)=>(a.index||9)-(b.index||9)):[];
      return pages.filter(p=>p.extract).map(p=>({t:p.title, s:trunc(p.extract,300), u:"https://en.wikipedia.org/wiki/"+encodeURIComponent(p.title.replace(/ /g,"_"))}));
    })()],
    ["fdalabel", (async()=>{
      const j=await jfetch("https://api.fda.gov/drug/label.json?search="+encodeURIComponent('openfda.brand_name:"'+drugTerm+'" OR openfda.generic_name:"'+drugTerm+'"')+"&limit=2");
      const tl=drugTerm.toLowerCase();
      const items=[];
      (j.results||[]).forEach(r=>{
        const bf=r.openfda||{};
        const brand=(bf.brand_name||[]).join(", ")||"";
        const gen=(bf.generic_name||[]).join(", ")||"";
        if(!((brand+" "+gen).toLowerCase().includes(tl))) return;
        const box=r.boxed_warning?("⚠️ "+trunc(first(r.boxed_warning),320)):"";
        const uses=r.indications_and_usage?("Uses: "+trunc(first(r.indications_and_usage),320)):"";
        const dose=r.dosage_and_administration?("Dose: "+trunc(first(r.dosage_and_administration),320)):"";
        const contra=r.contraindications?("Contra: "+trunc(first(r.contraindications),260)):"";
        items.push({t:brand+(gen?" ("+gen+")":""), s:[box,uses,dose,contra].filter(Boolean).join(" · "), u:"https://dailymed.nlm.nih.gov/dailymed/search.cfm?labelquery="+dq});
      });
      return items;
    })()],
    ["rxnorm", (async()=>{
      const j=await jfetch("https://rxnav.nlm.nih.gov/REST/rxcui.json?name="+dq+"&search=1");
      const ids=(j.idGroup&&j.idGroup.rxnormId)||[];
      if(!ids.length) return [];
      const d=await jfetch("https://rxnav.nlm.nih.gov/REST/drugs.json?name="+dq);
      const names=[];
      ((d.drugGroup&&d.drugGroup.conceptGroup)||[]).forEach(g=>((g.conceptProperties)||[]).forEach(c=>{ if(c.name) names.push(c.name); }));
      return [{t:"RxNorm / RxCUI: "+ids.join(", "), s:"Related: "+trunc(names.slice(0,10).join(" · "),300)||"—", u:"https://mor.nlm.nih.gov/RxNav/search?searchBy=String&searchTerm="+dq}];
    })()],
    ["pubchem", (async()=>{
      const j=await jfetch("https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/"+dq+"/property/MolecularFormula,MolecularWeight,IUPACName,CanonicalSMILES/JSON");
      const p=(((j.PropertyTable||{}).Properties)||[])[0];
      if(!p) return [];
      return [{t:"PubChem CID "+p.CID, s:[p.MolecularFormula&&("Formula: "+p.MolecularFormula), p.MolecularWeight&&("MW: "+Number(p.MolecularWeight).toFixed(2)), p.IUPACName&&("IUPAC: "+trunc(p.IUPACName,120)), p.CanonicalSMILES&&("SMILES: "+trunc(p.CanonicalSMILES,120))].filter(Boolean).join(" · "), u:"https://pubchem.ncbi.nlm.nih.gov/#query="+dq}];
    })()],
    ["pubmed", (async()=>{
      const find=async(qt)=>{ const s=await jfetch("https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&retmode=json&retmax=5&sort=relevance&term="+encodeURIComponent(qt)); return (s.esearchresult&&s.esearchresult.idlist)||[]; };
      let ids=await find(term);
      if(!ids.length) ids=await find(term.split(/\s+/).slice(0,3).join(" "));
      if(!ids.length) ids=await find(drugTerm);
      if(!ids.length) return [];
      const d=await jfetch("https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&retmode=json&id="+ids.join(","));
      return ids.map(id=>{ const r=(d.result&&d.result[id])||{}; return {t:r.title||("PMID "+id), s:[r.source,r.pubdate].filter(Boolean).join(" · "), u:"https://pubmed.ncbi.nlm.nih.gov/"+id+"/"}; });
    })()],
    ["epmc", (async()=>{
      const find=async(qt)=>{ const j=await jfetch("https://www.ebi.ac.uk/europepmc/webservices/rest/search?query="+encodeURIComponent(qt)+"&format=json&pageSize=5&resultType=lite"); return ((j.resultList||{}).result)||[]; };
      let res=await find(term);
      if(!res.length) res=await find(term.split(/\s+/).slice(0,3).join(" "));
      if(!res.length) res=await find(drugTerm);
      return res.map(r=>{
        const u=r.pmid?("https://pubmed.ncbi.nlm.nih.gov/"+r.pmid+"/"):(r.doi?("https://doi.org/"+r.doi):"https://europepmc.org/search?query="+encodeURIComponent(term));
        return {t:r.title||r.id||"—", s:[r.authorString&&trunc(r.authorString,70),r.journalTitle,r.pubYear,r.citedByCount!==undefined&&(r.citedByCount+" cites")].filter(Boolean).join(" · "), u:u};
      });
    })()],
    ["trials", (async()=>{
      const j=await jfetch("https://clinicaltrials.gov/api/v2/studies?query.term="+q+"&pageSize=5&fields=NCTId,BriefTitle,OverallStatus,Condition,Phase");
      return (j.studies||[]).map(s=>{
        const ps=s.protocolSection||{};

        const cond=(ps.conditionsModule&&(ps.conditionsModule.conditions||[]).join(", "))||s.Condition||"";
        return {t:title, s:[id,st,cond].filter(Boolean).join(" · "), u:"https://clinicaltrials.gov/study/"+id};
      }).filter(x=>x.u!=="https://clinicaltrials.gov/study/");
    })()]
  ];
  const settled=await Promise.allSettled(jobs.map(j=>Promise.race([j[1], new Promise(r=>setTimeout(()=>r([]),budget))])));
  jobs.forEach((job,i)=>{ out[job[0]]=(settled[i].status==="fulfilled"&&settled[i].value)?settled[i].value:[]; });
  return out;
}

    for(const c of cands){

function shortTopicQuery(q, n){

    if(!sel.includes(w)) sel.push(w);
  }
  const chosen=new Set(sel);

    for(const w of ws.slice(0,30)){
      if(chosen.has(w) || !medStrong(w)) continue;
